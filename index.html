<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <title>Home Schooling & Sports Training Hub</title>
  <style>
    :root {
      --bg: #f8f9fc;
      --bg-secondary: #f1f3f9;
      --card: #ffffff;
      --text: #0f172a;
      --text-secondary: #334155;
      --muted: #64748b;
      --muted-light: #94a3b8;
      --primary: #6366f1;
      --primary-dark: #4f46e5;
      --primary-light: #eef2ff;
      --primary-glow: rgba(99,102,241,0.15);
      --border: #e2e8f0;
      --border-light: #f1f5f9;
      --success: #10b981;
      --success-light: #ecfdf5;
      --warning: #f59e0b;
      --warning-light: #fffbeb;
      --danger: #ef4444;
      --danger-light: #fef2f2;
      --info: #0ea5e9;
      --info-light: #f0f9ff;
      --radius-sm: 10px;
      --radius-md: 14px;
      --radius-lg: 20px;
      --radius-xl: 24px;
      --shadow-xs: 0 1px 2px rgba(15,23,42,0.04);
      --shadow-sm: 0 1px 3px rgba(15,23,42,0.06), 0 1px 2px rgba(15,23,42,0.04);
      --shadow: 0 4px 6px -1px rgba(15,23,42,0.07), 0 2px 4px -2px rgba(15,23,42,0.05);
      --shadow-md: 0 8px 16px -4px rgba(15,23,42,0.08), 0 4px 6px -2px rgba(15,23,42,0.04);
      --shadow-lg: 0 16px 32px -8px rgba(15,23,42,0.12), 0 8px 16px -4px rgba(15,23,42,0.06);
      --shadow-xl: 0 24px 48px -12px rgba(15,23,42,0.16), 0 12px 24px -6px rgba(15,23,42,0.08);
      --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; }
    body { margin: 0; font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); -webkit-font-smoothing: antialiased; font-size: 14px; line-height: 1.5; }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

    /* Login */
    .login-wrap { min-height: 100%; display: flex; align-items: center; justify-content: center; padding: 20px; background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 50%, #a855f7 100%); overflow-y: auto; position: relative; }
    .login-wrap::before { content: ''; position: absolute; inset: 0; background: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' width='60' height='60' viewBox='0 0 60 60'%3e%3cg fill='none' fill-rule='evenodd'%3e%3cg fill='%23ffffff' fill-opacity='0.05'%3e%3ccircle cx='30' cy='30' r='2'/%3e%3c/g%3e%3c/g%3e%3c/svg%3e"); }
    .login-card { background: var(--card); padding: 40px; border-radius: var(--radius-xl); box-shadow: var(--shadow-xl); width: 100%; max-width: 420px; border: 1px solid rgba(255,255,255,0.1); position: relative; z-index: 1; }
    .login-card h1 { margin: 0 0 8px; font-size: 26px; font-weight: 800; letter-spacing: -0.02em; background: linear-gradient(135deg, var(--primary) 0%, #8b5cf6 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    .login-card p { margin: 0 0 28px; color: var(--muted); font-size: 14px; line-height: 1.6; }
    .field { margin-bottom: 18px; }
    .field label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 7px; color: var(--text-secondary); }
    .field input, .field select, .field textarea { width: 100%; padding: 11px 14px; border: 1.5px solid var(--border); border-radius: var(--radius-sm); background: var(--card); color: var(--text); transition: var(--transition); font-size: 14px; }
    .field input:focus, .field select:focus, .field textarea:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 4px var(--primary-glow); }
    .field textarea { resize: vertical; }
    .btn { padding: 11px 20px; border: none; border-radius: var(--radius-sm); background: var(--primary); color: #fff; font-weight: 600; font-size: 14px; box-shadow: var(--shadow-sm); transition: var(--transition); }
    .btn:hover { background: var(--primary-dark); box-shadow: var(--shadow-md); transform: translateY(-1px); }
    .btn:active { transform: translateY(0); }
    .btn-block { width: 100%; }
    .btn-danger { background: var(--danger); }
    .btn-danger:hover { background: #dc2626; }
    .btn-ghost { background: transparent; color: var(--primary); border: 1.5px solid var(--border); box-shadow: none; }
    .btn-ghost:hover { background: var(--primary-light); border-color: var(--primary); }
    .btn-sm { padding: 8px 14px; font-size: 13px; }
    .error { color: var(--danger); font-size: 13px; margin-top: 12px; padding: 10px 14px; background: var(--danger-light); border-radius: var(--radius-sm); border: 1px solid rgba(239,68,68,0.2); }
    .hint { margin-top: 24px; padding-top: 18px; border-top: 1px solid var(--border-light); font-size: 12.5px; color: var(--muted); line-height: 1.6; }

    /* App Layout */
    .app { display: none; height: 100%; }
    .app.active { display: flex; }

    /* Sidebar */
    .sidebar { width: 280px; background: var(--card); border-right: 1px solid var(--border); display: flex; flex-direction: column; }
    .sidebar-head { padding: 20px 22px; border-bottom: 1px solid var(--border-light); display: flex; align-items: center; justify-content: space-between; }
    .sidebar-head h2 { margin: 0; font-size: 17px; font-weight: 800; letter-spacing: -0.02em; }
    .sidebar-tree { flex: 1; overflow-y: auto; padding: 16px 14px; }
    .tree-space { margin-bottom: 20px; }
    .space-header { display: flex; align-items: center; justify-content: space-between; padding: 0 6px; }
    .space-name { font-weight: 700; font-size: 11px; color: var(--muted); padding: 8px 0; text-transform: uppercase; letter-spacing: 0.08em; }
    .space-add-btn { width: 24px; height: 24px; padding: 0; border: none; border-radius: 8px; background: transparent; color: var(--muted); font-size: 16px; line-height: 1; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: var(--transition); }
    .space-add-btn:hover { background: var(--primary-light); color: var(--primary); }
    .student-section { margin-bottom: 24px; }
    .student-header { font-size: 11px; font-weight: 700; color: var(--primary); padding: 10px 12px; margin: 0 0 10px; background: var(--primary-light); border-radius: var(--radius-sm); text-transform: uppercase; letter-spacing: 0.06em; }
    .tree-folder { margin-left: 4px; }
    .folder-row { display: flex; align-items: center; gap: 7px; padding: 8px 10px; border-radius: var(--radius-sm); color: var(--text); font-size: 13.5px; font-weight: 500; position: relative; transition: var(--transition); }
    .folder-row:hover, .folder-row.active { background: var(--bg-secondary); }
    .chevron { width: 14px; text-align: center; color: var(--muted-light); font-size: 10px; }
    .folder-icon { color: var(--muted-light); font-size: 14px; }
    .folder-name { flex: 1; }
    .tree-lists { margin-left: 22px; display: none; border-left: 1.5px solid var(--border-light); padding-left: 10px; }
    .tree-lists.open { display: block; }
    .list-row { display: flex; align-items: center; gap: 8px; padding: 7px 10px; border-radius: var(--radius-sm); font-size: 13px; color: var(--muted); cursor: pointer; position: relative; transition: var(--transition); }
    .list-row:hover { background: var(--bg-secondary); color: var(--text); }
    .list-row.active { background: var(--primary-light); color: var(--primary-dark); font-weight: 600; }
    .list-row .count { font-size: 10.5px; background: var(--bg-secondary); color: var(--muted); padding: 2px 8px; border-radius: 12px; font-weight: 600; }
    .list-row.active .count { background: #fff; color: var(--primary); }
    .sidebar-actions { padding: 14px; border-top: 1px solid var(--border-light); display: flex; gap: 8px; }
    .sidebar-actions button { flex: 1; font-size: 12.5px; padding: 9px; }

    /* Main */
    .main { flex: 1; display: flex; flex-direction: column; min-width: 0; overflow: hidden; }
    .header { background: var(--card); border-bottom: 1px solid var(--border-light); padding: 16px 32px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 14px; }
    .header h2 { margin: 0; font-size: 20px; font-weight: 800; letter-spacing: -0.02em; }
    .breadcrumb { font-size: 13px; color: var(--muted); margin-top: 4px; }
    .header .meta { display: flex; align-items: center; gap: 14px; }
    #userLabel { font-size: 13px; font-weight: 600; color: var(--text-secondary); background: var(--bg-secondary); padding: 8px 16px; border-radius: 24px; }
    .view-switcher { display: flex; align-items: center; gap: 4px; margin-top: 12px; flex-wrap: wrap; background: var(--bg-secondary); padding: 5px; border-radius: var(--radius-sm); width: fit-content; }
    .view-switcher button { padding: 7px 16px; border: none; background: transparent; border-radius: 8px; font-size: 13px; font-weight: 600; color: var(--muted); transition: var(--transition); }
    .view-switcher button:hover:not(.active):not(:disabled) { color: var(--text); }
    .view-switcher button.active { background: var(--card); color: var(--primary); box-shadow: var(--shadow-sm); }
    .view-switcher button:disabled { opacity: 0.4; cursor: not-allowed; }
    .view-sep { width: 1px; height: 18px; background: var(--border); margin: 0 4px; }
    .calendar-nav { display: none; align-items: center; gap: 10px; }
    .date-label { font-size: 14px; font-weight: 700; min-width: 120px; text-align: center; color: var(--text); }

    /* Board */
    .board { flex: 1; padding: 28px 32px; overflow: auto; min-height: 0; display: block; }
    .columns { display: grid; grid-template-columns: repeat(5, minmax(260px, 1fr)); gap: 18px; min-width: 1300px; }
    .column { background: var(--bg-secondary); border-radius: var(--radius-md); padding: 18px; border: 1px solid var(--border-light); }
    .column h3 { margin: 0 0 16px; font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); display: flex; align-items: center; gap: 8px; }
    .tasks { display: flex; flex-direction: column; gap: 10px; }
    .task { background: var(--card); border-radius: var(--radius-md); padding: 16px 18px; box-shadow: var(--shadow-sm); cursor: pointer; border: 1px solid var(--border-light); transition: var(--transition); }
    .task:hover { box-shadow: var(--shadow-md); transform: translateY(-2px); border-color: var(--border); }
    .task-title { font-weight: 600; margin-bottom: 10px; font-size: 14px; line-height: 1.4; }
    .task-meta { font-size: 12.5px; color: var(--muted); display: flex; flex-direction: column; gap: 6px; }
    .badge { display: inline-block; padding: 3px 10px; border-radius: 14px; font-size: 10.5px; font-weight: 700; letter-spacing: 0.03em; }
    .priority-high { background: var(--danger-light); color: #b91c1c; }
    .priority-medium { background: var(--warning-light); color: #92400e; }
    .priority-low { background: var(--success-light); color: #065f46; }
    .priority-optional { background: var(--info-light); color: #0369a1; }
    .empty { color: var(--muted-light); font-size: 13px; text-align: center; padding: 28px 0; border: 1.5px dashed var(--border); border-radius: var(--radius-sm); }

    .hidden { display: none !important; }

    /* Modal */
    .modal-overlay { position: fixed; inset: 0; background: rgba(15,23,42,0.4); backdrop-filter: blur(4px); display: none; align-items: center; justify-content: center; z-index: 100; padding: 20px; }
    .modal-overlay.active { display: flex; }
    .modal { background: var(--card); border-radius: var(--radius-lg); width: 100%; max-width: 620px; max-height: 90vh; overflow-y: auto; box-shadow: var(--shadow-xl); }
    .modal-header { padding: 22px 28px; border-bottom: 1px solid var(--border-light); display: flex; justify-content: space-between; align-items: center; }
    .modal-header h3 { margin: 0; font-size: 18px; font-weight: 700; letter-spacing: -0.01em; }
    .modal-body { padding: 24px 28px; }
    .modal-footer { padding: 18px 28px; border-top: 1px solid var(--border-light); display: flex; justify-content: flex-end; gap: 10px; align-items: center; }
    .close { background: transparent; border: none; font-size: 24px; line-height: 1; color: var(--muted); width: 36px; height: 36px; border-radius: var(--radius-sm); transition: var(--transition); }
    .close:hover { background: var(--bg-secondary); color: var(--text); }

    /* Calendar */
    .calendar { flex: 1; padding: 28px 32px; overflow: hidden; display: none; }
    .calendar.active { display: flex; flex-direction: column; }
    #calendarGrid { flex: 1; min-height: 0; overflow-y: auto; }
    #calendarGrid.month-view { overflow-y: hidden; overflow-x: auto; }

    /* Filter Bar */
    .filter-bar { background: var(--card); border-top: 1px solid var(--border-light); padding: 12px 32px; display: none; gap: 12px; align-items: center; font-size: 13px; flex-shrink: 0; }
    .filter-bar.active { display: flex; }
    .filter-dropdown { position: relative; }
    .filter-dropdown-btn { padding: 7px 16px; border: 1.5px solid var(--border); border-radius: var(--radius-sm); background: var(--card); color: var(--text-secondary); font-size: 13px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 8px; white-space: nowrap; transition: var(--transition); }
    .filter-dropdown-btn:hover { border-color: var(--primary); color: var(--primary); }
    .filter-dropdown-btn .chev { font-size: 10px; color: var(--muted); }
    .filter-dropdown-menu { position: absolute; bottom: 100%; left: 0; margin-bottom: 8px; background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-md); box-shadow: var(--shadow-lg); padding: 10px; min-width: 200px; max-height: 280px; overflow-y: auto; z-index: 100; display: none; }
    .filter-dropdown-menu.open { display: block; }
    .filter-dropdown-menu label { display: flex; align-items: center; gap: 10px; padding: 7px 6px; cursor: pointer; color: var(--text); font-size: 13px; border-radius: 6px; transition: var(--transition); }
    .filter-dropdown-menu label:hover { background: var(--bg-secondary); }
    .filter-dropdown-menu input[type="checkbox"] { cursor: pointer; width: 16px; height: 16px; accent-color: var(--primary); }

    /* Calendar Grid */
    .calendar-toolbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; flex-wrap: wrap; gap: 12px; }
    .calendar-toolbar .group { display: flex; align-items: center; gap: 8px; }
    .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); grid-auto-rows: minmax(120px, max-content); gap: 10px; align-content: start; }
    .month-view { display: flex; flex: 1; min-height: 0; overflow-x: auto; scroll-snap-type: x mandatory; scroll-behavior: smooth; }
    .month-panel { flex: 0 0 100%; min-width: 100%; scroll-snap-align: start; }
    .calendar-day { background: var(--card); border: 1px solid var(--border-light); border-radius: var(--radius-md); padding: 12px; min-height: 120px; transition: var(--transition); }
    .calendar-day:hover { border-color: var(--border); box-shadow: var(--shadow-sm); }
    .calendar-day .day-label { font-size: 13px; font-weight: 700; color: var(--muted); margin-bottom: 10px; }
    .calendar-day .day-tasks { display: flex; flex-direction: column; gap: 6px; }
    .calendar-task { padding: 7px 10px; border-radius: 8px; background: var(--bg-secondary); font-size: 12px; cursor: pointer; border-left: 3px solid var(--primary); transition: var(--transition); }
    .calendar-task:hover { transform: translateX(2px); }
    .calendar-task .time { color: var(--muted); font-size: 11px; }
    .calendar-other-month { opacity: 0.5; background: var(--bg-secondary); }
    .calendar-week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 10px; }
    .calendar-day-view { max-width: 720px; }
    .calendar-day-view .day-header { font-size: 18px; font-weight: 700; margin-bottom: 16px; }
    .calendar-day-view .day-task { padding: 16px; border: 1px solid var(--border-light); border-radius: var(--radius-md); margin-bottom: 8px; background: var(--card); cursor: pointer; transition: var(--transition); }
    .calendar-day-view .day-task:hover { box-shadow: var(--shadow-sm); border-color: var(--primary); }

    /* PDF */
    .pdf-preview { padding: 40px; line-height: 1.6; }
    .pdf-preview h1 { font-size: 22px; margin-bottom: 8px; }
    .pdf-preview .meta { color: #555; font-size: 13px; margin-bottom: 24px; }
    .pdf-preview .section { margin-bottom: 20px; }
    .pdf-preview .section h4 { margin: 0 0 6px; font-size: 13px; text-transform: uppercase; color: #777; }
    .pdf-preview .section p { margin: 0; white-space: pre-wrap; }

    /* Pickers */
    .picker-modal { max-width: 380px; overflow: visible; }
    .picker-header { display: flex; align-items: center; justify-content: space-between; padding: 20px 24px; border-bottom: 1px solid var(--border-light); }
    .picker-title { font-weight: 700; font-size: 16px; }
    .picker-arrow { background: transparent; border: 1.5px solid var(--border); border-radius: var(--radius-sm); width: 34px; height: 34px; color: var(--primary); font-weight: 700; cursor: pointer; transition: var(--transition); }
    .picker-arrow:hover { background: var(--bg-secondary); border-color: var(--primary); }
    .picker-dow { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; font-size: 11.5px; font-weight: 600; color: var(--muted-light); padding: 16px 18px 0; }
    .picker-days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; padding: 10px 18px 18px; }
    .day-cell { aspect-ratio: 1; display: flex; align-items: center; justify-content: center; border-radius: 50%; border: none; background: transparent; font-size: 13px; color: var(--text); cursor: pointer; padding: 0; transition: var(--transition); }
    .day-cell:hover { background: var(--bg-secondary); }
    .day-cell.other { color: var(--muted-light); opacity: 0.5; }
    .day-cell.today { box-shadow: inset 0 0 0 2px var(--primary); font-weight: 700; }
    .day-cell.selected { background: var(--primary); color: #fff; }
    .picker-footer { display: flex; gap: 8px; padding: 16px 18px 20px; border-top: 1px solid var(--border-light); }
    .picker-btn { flex: 1; padding: 11px; border-radius: var(--radius-sm); font-weight: 600; font-size: 13px; background: transparent; cursor: pointer; transition: var(--transition); }
    .picker-dashed { border: 1.5px dashed var(--primary); color: var(--primary); }
    .picker-dashed:hover { background: var(--primary-light); }
    .picker-primary { background: var(--primary); color: #fff; border: 1.5px solid var(--primary); }
    .picker-primary:hover { background: var(--primary-dark); }
    .time-picker { text-align: center; }
    .time-display { font-size: 44px; font-weight: 300; padding: 28px 0 6px; font-variant-numeric: tabular-nums; color: var(--text); letter-spacing: -0.02em; }
    .time-sub { font-size: 11px; font-weight: 600; letter-spacing: 0.1em; color: var(--muted-light); margin-bottom: 16px; }
    .time-ampm { display: flex; justify-content: center; gap: 8px; margin-bottom: 20px; }
    .ampm-btn { padding: 7px 20px; border: 1.5px solid var(--border); border-radius: 24px; background: transparent; color: var(--text); cursor: pointer; font-weight: 600; font-size: 13px; transition: var(--transition); }
    .ampm-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }
    .time-dial { width: 260px; height: 260px; margin: 0 auto 20px; position: relative; border-radius: 50%; border: 1.5px solid var(--border); background: var(--bg-secondary); }
    .dial-number { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 38px; height: 38px; border-radius: 50%; border: none; background: transparent; font-size: 14px; font-weight: 600; color: var(--text); cursor: pointer; transition: var(--transition); }
    .dial-number:hover { background: var(--card); box-shadow: var(--shadow-sm); }
    .dial-number.selected { background: var(--primary); color: #fff; }

    @media (max-width: 900px) {
      .columns { grid-template-columns: 1fr; min-width: auto; }
      .calendar-grid { grid-template-columns: repeat(2, 1fr); }
      .calendar-week { grid-template-columns: 1fr; }
      .header { flex-direction: column; align-items: flex-start; gap: 10px; }
      .calendar-nav { margin-top: 8px; }
    }

    @media print {
      body * { visibility: hidden; }
      #printArea, #printArea * { visibility: visible; }
      #printArea { position: absolute; left: 0; top: 0; width: 100%; }
    }
    .folder-body { display: none; }
    .folder-body.open { display: block; }
    .folder-children { margin-left: 12px; }
    .list-name { flex: 1; }
    .menu-btn { width: 26px; height: 26px; padding: 0; border: none; border-radius: 8px; background: transparent; color: var(--muted-light); font-size: 14px; line-height: 1; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: var(--transition); }
    .menu-btn:hover, .menu-btn.active { background: var(--primary-light); color: var(--primary); }
    .dropdown-menu { position: fixed; z-index: 200; min-width: 170px; background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-md); box-shadow: var(--shadow-lg); padding: 8px; display: flex; flex-direction: column; gap: 2px; }
    .dropdown-item { padding: 9px 12px; font-size: 13px; font-weight: 500; color: var(--text); background: transparent; border: none; border-radius: 8px; text-align: left; cursor: pointer; transition: var(--transition); }
    .dropdown-item:hover { background: var(--primary-light); color: var(--primary-dark); }
    .dropdown-item.danger { color: var(--danger); }
    .dropdown-item.danger:hover { background: var(--danger-light); color: #b91c1c; }
    .field-section { margin-bottom: 24px; }
    .field-section:last-child { margin-bottom: 0; }
    .section-title { font-size: 11px; font-weight: 700; color: var(--primary); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 14px; padding-left: 10px; border-left: 3px solid var(--primary); }
    .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .field-row .field { margin-bottom: 0; }
    #tTitle { font-size: 15px; font-weight: 600; }

    function loadSpaces() {
      const raw = localStorage.getItem(SPACE_KEY);
      spaces = raw ? JSON.parse(raw) : seedSpaces();
      if (!raw) saveSpaces();
      else migrateSpaces();
      syncSpacesFromSupabase();

    async function syncSpacesFromSupabase() {
      try {
        const { data: rows, error } = await supabaseClient.from('hs_spaces').select('*').eq('id', 'main');
        if (error) throw error;
        if (rows && rows.length && rows[0].data && Array.isArray(rows[0].data)) {
          spaces = rows[0].data;
          localStorage.setItem(SPACE_KEY, JSON.stringify(spaces));
          migrateSpaces();

          saveSpaces();
        }
      } catch (err) { console.error('Supabase sync spaces failed', err); }

    function migrateSpaces() {
      function walk(folders) {
        (folders || []).forEach(f => {
          if (!Array.isArray(f.folders)) f.folders = [];
          if (!Array.isArray(f.lists)) f.lists = [];
          walk(f.folders);
        });
      }
      spaces.forEach(s => walk(s.folders));
      saveSpaces();
    }

    function saveSpaces() {
      localStorage.setItem(SPACE_KEY, JSON.stringify(spaces));
    }

    async function syncSpacesToSupabase() {
      try {
        const { error } = await supabaseClient.from('hs_spaces').upsert({ id: 'main', data: spaces });
        if (error) throw error;
      } catch (err) { console.error('Supabase spaces sync failed', err); }
    }

    function migrateTaskFields(arr) {
      arr.forEach(t => {
        if (t.assignee && legacyToEmail[t.assignee]) t.assignee = legacyToEmail[t.assignee];
        if (t.due && !t.dueDate) { t.dueDate = t.due; t.dueTime = ''; }
        if (t.due !== undefined) delete t.due;
        if (!t.startDate && t.dueDate) t.startDate = t.dueDate;
        if (t.startTime === undefined) t.startTime = '';
        if (t.dueTime === undefined) t.dueTime = '';
        if (!t.status) t.status = 'Planned';
        if (!t.priority) t.priority = 'Medium';
        if (t.desc === undefined) t.desc = '';
        if (t.notes === undefined) t.notes = '';
      });
      return arr;
    }

    function loadTasks() {
      const raw = localStorage.getItem(STORAGE_KEY);
      let arr = raw ? JSON.parse(raw) : seedTasks();
      migrateTaskFields(arr);
      tasks = arr;
      saveTasks();
      syncTasksFromSupabase();
    }

    async function syncTasksFromSupabase() {
      try {
        const { data: rows, error } = await supabaseClient.from('hs_tasks').select('*');
        if (error) throw error;
        if (rows && rows.length) {
          const arr = rows.map(row => {
            const d = (row && row.data) || {};
            return { ...d, id: d.id || row.id };
          }).filter(t => t.id);
          migrateTaskFields(arr);
          tasks = arr;
          localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
          if (currentUser) {
            renderSidebar();
            if (currentView === 'board') renderBoard(); else if (currentView === 'calendar') renderCalendar();
          }
        } else {
          saveTasks();
        }
      } catch (err) { console.error('Supabase sync tasks failed', err); }
    }

      localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
    }

    function findList(listId) {
      for (const space of spaces) {
        const res = findListInFolders(listId, space.folders, [], space);
        if (res) return res;
      }
      return null;
    }

    function findListInFolders(listId, folders, ancestors, space) {
      for (const folder of (folders || [])) {
        for (const list of (folder.lists || [])) {
          if (list.id === listId) return { space, ancestors: [...ancestors], folder, list };
        }
        const nested = findListInFolders(listId, folder.folders, [...ancestors, folder], space);
        if (nested) return nested;
      }
      return null;
    }

    function getAllLists() {
      const lists = [];
      function walk(folders) {
        (folders || []).forEach(folder => {
          (folder.lists || []).forEach(list => lists.push(list));
          walk(folder.folders);
        });
      }
      spaces.forEach(space => {
        (space.lists || []).forEach(list => lists.push(list));
        walk(space.folders);
      });
      return lists;
    }

    function getAllFolders() {
      const folders = [];
      function walk(fs, parent) {
        (fs || []).forEach(folder => {
          folders.push({ id: folder.id, name: folder.name, parentId: parent });
          walk(folder.folders, folder.id);
        });
      }
      spaces.forEach(space => walk(space.folders, null));
      return folders;
    }

    function getTopLevelFolders() {
      return getAllFolders().filter(f => f.parentId === null);
    }

    function getListFolderId(listId) {
      function walk(folders) {
        for (const folder of (folders || [])) {
          if ((folder.lists || []).some(l => l.id === listId)) return folder.id;
          const found = walk(folder.folders);
          if (found) return found;
        }
        return null;
      }
      for (const space of spaces) {
        if ((space.lists || []).some(l => l.id === listId)) return null;
        const found = walk(space.folders);
        if (found) return found;
      }
      return null;
    }

    function getListSpaceId(listId) {
      function walk(folders, spaceId) {
        for (const folder of (folders || [])) {
          if ((folder.lists || []).some(l => l.id === listId)) return spaceId;
          const found = walk(folder.folders, spaceId);
          if (found) return found;
        }
        return null;
      }
      for (const space of spaces) {
        if ((space.lists || []).some(l => l.id === listId)) return space.id;
        const found = walk(space.folders, space.id);
        if (found) return found;
      }
      return null;
    }

    let _listColorCache = null;
    function buildListColorCache() {
      const keys = new Set();
      tasks.forEach(t => {
        if (t.listId) keys.add(t.listId + '|' + (t.assignee || ''));
      });
      getAllLists().forEach(list => {
        keys.add(list.id + '|');
      });
      const sorted = Array.from(keys).sort();
      const map = {};
      sorted.forEach((key, i) => {
        const hue = (i * 137.508) % 360;
        map[key] = {
          bg: 'hsl(' + hue.toFixed(1) + ', 70%, 88%)',
          border: 'hsl(' + hue.toFixed(1) + ', 65%, 45%)'
        };
      });
      _listColorCache = map;

    function toggleDropdown(btn, type, id) {
      if (btn.classList.contains('active')) {
        closeAllDropdowns();
        return;

      closeAllDropdowns();
      btn.classList.add('active');
      const dropdown = document.createElement('div');
      dropdown.className = 'dropdown-menu';
      dropdown.addEventListener('click', e => e.stopPropagation());
      const items = type === 'folder' ? [

        { action: 'add-list', label: 'Add List' },
        { action: 'rename-folder', label: 'Rename' },
        { action: 'delete-folder', label: 'Delete', danger: true }
      ] : [
        { action: 'rename-list', label: 'Rename' },
        { action: 'delete-list', label: 'Delete', danger: true }
      ];
      items.forEach(item => {
        const el = document.createElement('button');
        el.type = 'button';
        el.className = 'dropdown-item' + (item.danger ? ' danger' : '');
        el.textContent = item.label;

          closeAllDropdowns();
          if (type === 'folder') onFolderAction(item.action, id);
          else onListAction(item.action, id);
        });
        dropdown.appendChild(el);
      });
      const rect = btn.getBoundingClientRect();
      const width = 150;
      dropdown.style.top = (rect.bottom + 4) + 'px';
      dropdown.style.left = Math.max(4, Math.min(window.innerWidth - width - 4, rect.right - width)) + 'px';
      document.body.appendChild(dropdown);

    function toISODate(d) {
      return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    }

    function addDays(d, days) { const r = new Date(d); r.setDate(r.getDate() + days); return r; }
    function addMonths(d, m) { const r = new Date(d); r.setMonth(r.getMonth() + m); return r; }
    function startOfWeek(d) { const r = new Date(d.getFullYear(), d.getMonth(), d.getDate()); r.setDate(r.getDate() - r.getDay()); return r; }

    function formatDateTime(date, time) {
      if (!date) return '—';
      return time ? date + ' at ' + time : date;
    }

    function parseTimeToMinutes(t) {
      if (!t) return null;
      const m = String(t).match(/^([0-9]{1,2}):([0-9]{2})$/);
      if (!m) return null;
      const h = Number(m[1]);
      const min = Number(m[2]);
      if (h > 23 || min > 59) return null;
      return h * 60 + min;
    }

    function formatHourLabel(h) {
      const h12 = h % 12 || 12;
      return h12 + (h < 12 ? 'am' : 'pm');
    }

    function formatTime12(hhmm) {
      if (!hhmm) return '';
      const m = String(hhmm).match(/^([0-9]{1,2}):([0-9]{2})$/);
      if (!m) return hhmm;
      let h = Number(m[1]);
      const min = Number(m[2]);
      const h12 = h % 12 || 12;
      return h12 + ':' + String(min).padStart(2, '0') + (h < 12 ? 'am' : 'pm');
    }

    function getDayTaskRanges(dateStr, visibleTasks) {
      const ranges = [];
      visibleTasks.forEach(task => {
        const start = task.startDate || task.dueDate;
        const end = task.dueDate || task.startDate;
        if (!start || !end || dateStr < start || dateStr > end) return;
        const isStart = dateStr === start;
        const isEnd = dateStr === end;
        const startT = parseTimeToMinutes(task.startTime);
        const dueT = parseTimeToMinutes(task.dueTime);
        let startMins = 0;
        let endMins = 24 * 60;
        let allDay = false;
        if (isStart && startT !== null) startMins = startT;
        if (isEnd && dueT !== null) endMins = dueT;
        if (!isStart && !isEnd) allDay = true;
        if (isStart && isEnd && startT === null && dueT === null) allDay = true;
        if (isStart && isEnd && startT === null && dueT !== null) startMins = Math.max(0, dueT - 60);
        if (isStart && isEnd && startT !== null && dueT === null) endMins = Math.min(24 * 60, startT + 60);
        if (isStart && !isEnd && startT === null) { startMins = 0; endMins = 24 * 60; allDay = true; }
        if (!isStart && isEnd && dueT === null) { startMins = 0; endMins = 24 * 60; allDay = true; }
        if (endMins <= startMins) endMins = startMins + 60;
        if (allDay) { startMins = 0; endMins = 24 * 60; }
        ranges.push({ task, startMins, endMins, allDay });
      });
      return ranges;
    }

    function createTimeEvent(task, startMins, endMins, allDay) {
      const el = document.createElement('div');
      const color = getListColor(task.listId, task.assignee);
      el.className = 'calendar-event' + (allDay ? ' all-day' : '');
      el.style.backgroundColor = color.bg;
      el.style.borderLeftColor = color.border;
      el.addEventListener('click', () => openTask(task.id));
      const startStr = formatTime12(task.startTime);
      const endStr = formatTime12(task.dueTime);
      let time = '';
      if (startStr && endStr) time = startStr + ' – ' + endStr;
      else if (startStr || endStr) time = (startStr || endStr);
      const snippet = (task.notes ? task.notes : (task.desc || '')).substring(0, 60);
      const full = (task.notes ? task.notes : (task.desc || ''));
      const noteText = full.length > 60 ? snippet + '…' : snippet;
      el.innerHTML = '<strong>' + escapeHtml(task.title) + '</strong>' +
        (time ? '<div class="event-time">' + time + '</div>' : '') +
        (noteText ? '<div class="event-desc">' + escapeHtml(noteText) + '</div>' : '');
      if (!allDay) {
        const top = (startMins / 60) * 50;
        const height = Math.max(30, ((endMins - startMins) / 60) * 50);
        el.style.top = top + 'px';
        el.style.height = height + 'px';
      }
      return el;
    }

    function positionEvents(events) {
      if (events.length < 2) return;
      const sorted = events.slice().sort((a, b) => a.startMins - b.startMins || a.endMins - b.endMins);
      const clusters = [];
      let current = [sorted[0]];
      for (let i = 1; i < sorted.length; i++) {
        const e = sorted[i];
        const lastEnd = Math.max(...current.map(x => x.endMins));
        if (e.startMins < lastEnd) {
          current.push(e);
        } else {
          clusters.push(current);
          current = [e];
        }
      }
      clusters.push(current);
      clusters.forEach(cluster => {
        const colEnd = [];
        cluster.forEach(e => {
          let col = colEnd.findIndex(end => end <= e.startMins);
          if (col === -1) { col = colEnd.length; colEnd.push(e.endMins); }
          else { colEnd[col] = e.endMins; }
          e._col = col;
        });
        const maxCol = Math.max(1, colEnd.length);
        cluster.forEach(e => {
          e.el.style.left = 'calc(' + (e._col / maxCol * 100).toFixed(4) + '% + 2px)';
          e.el.style.width = 'calc(' + (100 / maxCol).toFixed(4) + '% - 4px)';
          e.el.style.right = 'auto';
        });
      });
    }

    function escapeHtml(s) {
      return s.split('').map(c => {
        if (c === '&') return '&amp;';
        if (c === '<') return '&lt;';
        if (c === '>') return '&gt;';
        if (c === '"') return '&quot;';
        if (c === "'") return '&#39;';
        return c;
      }).join('');
    }

    function buildSpaceOptions() {
      return spaces.map(s => ({ value: s.id, label: s.name }));
    }

    function buildCategoryOptions(spaceId) {
      const space = spaces.find(s => s.id === spaceId);
      if (!space) return [];
      return (space.folders || []).map(f => ({ value: f.id, label: f.name }));
    }

    function buildListOptionsForCategory(spaceId, folderId) {
      const space = spaces.find(s => s.id === spaceId);
      if (!space) return [];
      function walk(folders) {
        for (const folder of (folders || [])) {
          if (folder.id === folderId) {
            return (folder.lists || []).map(l => ({ value: l.id, label: l.name }));
          }
          const found = walk(folder.folders);
          if (found) return found;
        }
        return null;
      }
      const found = walk(space.folders);
      if (found) return found;
      return (space.lists || []).map(l => ({ value: l.id, label: l.name }));
    }

    function buildListOptions() {
      const opts = [];
      spaces.forEach(space => {
        addFolderListOptions(space.folders, [space.name], opts);
      });
      return opts;
    }

    function addFolderListOptions(folders, path, opts) {
      for (const folder of (folders || [])) {
        const folderPath = path.concat(folder.name);
        for (const list of (folder.lists || [])) {
          opts.push({ value: list.id, label: folderPath.concat(list.name).join(' / ') });
        }
        addFolderListOptions(folder.folders, folderPath, opts);
      }
    }

    function openTask(id) {
      const task = id ? tasks.find(t => t.id === id) : null;
      const isManager = currentUser.role === 'manager';
      const editable = isManager || (task && task.assignee === currentUser.email);
      document.getElementById('modalTitle').textContent = task ? 'Edit Task' : 'New Task';
      document.getElementById('deleteTaskBtn').classList.toggle('hidden', !isManager || !task);
      document.getElementById('printNotesBtn').classList.toggle('hidden', !task);

      const studentOptions = Object.entries(userMap).filter(([email,u]) => u.role === 'student').map(([email,u]) => ({value: email, label: u.name}));

      const currentListId = task ? task.listId : activeListId;
      const currentSpaceId = getListSpaceId(currentListId) || (spaces[0] && spaces[0].id);
      const currentFolderId = getListFolderId(currentListId) || null;

      fillSelect('tSpace', buildSpaceOptions(), currentSpaceId);
      fillSelect('tCategory', buildCategoryOptions(currentSpaceId), currentFolderId);
      fillSelect('tList', buildListOptionsForCategory(currentSpaceId, currentFolderId), currentListId);
      fillSelect('tStatus', statuses, (task && statuses.includes(task.status)) ? task.status : 'Planned');
      fillSelect('tAssignee', studentOptions, task ? task.assignee : (studentOptions[0] && studentOptions[0].value));
      fillSelect('tPriority', priorities, (task && priorities.includes(task.priority)) ? task.priority : 'Medium');

      const tSpace = document.getElementById('tSpace');
      const tCategory = document.getElementById('tCategory');
      const tList = document.getElementById('tList');
      tSpace.onchange = () => {
        const sp = tSpace.value;
        const cats = buildCategoryOptions(sp);
        fillSelect('tCategory', cats, cats[0] && cats[0].value);
        const lists = buildListOptionsForCategory(sp, tCategory.value);
        fillSelect('tList', lists, lists[0] && lists[0].value);
      };
      tCategory.onchange = () => {
        const lists = buildListOptionsForCategory(tSpace.value, tCategory.value);
        fillSelect('tList', lists, lists[0] && lists[0].value);
      };

      document.getElementById('tTitle').value = task ? task.title : '';
      document.getElementById('tStartDate').value = task ? (task.startDate || '') : '';
      document.getElementById('tStartTime').value = task ? (task.startTime || '') : '';
      document.getElementById('tDueDate').value = task ? (task.dueDate || '') : '';
      document.getElementById('tDueTime').value = task ? (task.dueTime || '') : '';
      document.getElementById('tDesc').value = task ? task.desc : '';
      document.getElementById('tNotes').value = task ? task.notes : '';

      ['tTitle','tSpace','tCategory','tList','tAssignee','tPriority','tStartDate','tStartTime','tDueDate','tDueTime','tDesc'].forEach(id => {
        document.getElementById(id).disabled = !isManager;
      });
      document.getElementById('tStatus').disabled = !editable;
      document.getElementById('tNotes').disabled = !editable;
      document.getElementById('saveTaskBtn').style.display = editable ? 'inline-block' : 'none';

      document.getElementById('printNotesBtn').onclick = () => { if (task) printTaskNotes(task); };
      document.getElementById('modal').dataset.id = id || '';
      document.getElementById('modal').classList.add('active');
    }

    function fillSelect(id, items, selected) {
      const sel = document.getElementById(id);
      sel.innerHTML = '';
      items.forEach(item => {
        const opt = document.createElement('option');
        if (typeof item === 'string') { opt.value = item; opt.textContent = item; }
        else { opt.value = item.value; opt.textContent = item.label; }
        if (opt.value === selected) opt.selected = true;
        sel.appendChild(opt);
      });
    }

    function closeModal() { document.getElementById('modal').classList.remove('active'); }

    function saveTask() {
      const id = document.getElementById('modal').dataset.id;
      const task = id ? tasks.find(t => t.id === id) : null;
      const editable = currentUser.role === 'manager' || (task && task.assignee === currentUser.email);
      if (!editable) { closeModal(); return; }
      const values = {
        title: document.getElementById('tTitle').value.trim(),
        listId: document.getElementById('tList').value,
        status: document.getElementById('tStatus').value,
        assignee: document.getElementById('tAssignee').value,
        priority: document.getElementById('tPriority').value,
        startDate: document.getElementById('tStartDate').value,
        startTime: document.getElementById('tStartTime').value,
        dueDate: document.getElementById('tDueDate').value,
        dueTime: document.getElementById('tDueTime').value,
        desc: document.getElementById('tDesc').value.trim(),
        notes: document.getElementById('tNotes').value.trim()
      };
      if (!values.title) { alert('Title is required'); return; }

      let updated;
      if (id) {
        const idx = tasks.findIndex(t => t.id === id);
        if (idx !== -1) {
          if (currentUser.role === 'manager') {
            updated = { ...values, id: id };
            tasks[idx] = updated;
          } else {
            tasks[idx].status = values.status;
            tasks[idx].notes = values.notes;
            updated = tasks[idx];
          }
        }
      } else if (currentUser.role === 'manager') {
        updated = { ...values, id: generateId() };
        tasks.push(updated);
      } else {
        closeModal(); return;
      }
      saveTasks();
      if (updated) {
        Promise.resolve(supabaseClient.from('hs_tasks').upsert({ id: updated.id, data: updated })).catch(err => console.error('Supabase task sync failed', err));
      }
      renderSidebar();
      render();
      closeModal();
    }

    function deleteTask() {
      const id = document.getElementById('modal').dataset.id;
      const task = tasks.find(t => t.id === id);
      if (!id || !task) return;
      if (currentUser.role !== 'manager' && task.assignee !== currentUser.email) return;
      if (confirm('Delete this task?')) {
        tasks = tasks.filter(t => t.id !== id);
        saveTasks();
        Promise.resolve(supabaseClient.from('hs_tasks').delete().eq('id', id)).catch(err => console.error('Supabase task delete failed', err));
        renderSidebar();
        render();
        closeModal();
      }
    }

    function findFolder(folderId) {
      for (const space of spaces) {
        const res = findFolderIn(space.folders, [], space, space.folders);
        if (res) return res;
      }
      return null;
    }

    function findFolderIn(folders, ancestors, space, parent) {
      for (let i = 0; i < folders.length; i++) {
        const f = folders[i];
        if (f.id === folderId) return { space, parent, folder: f, ancestors: [...ancestors] };
        const res = findFolderIn(f.folders, [...ancestors, f], space, f.folders);
        if (res) return res;
      }
      return null;
    }

    function promptAddFolderToSpace(spaceId) {

    function deleteFolder(folderId) {
      const found = findFolder(folderId);
      if (!found) return;
      if (!confirm('Delete folder "' + found.folder.name + '" and all its lists?')) return;
      const listIds = collectListIds(found.folder);
      const deletedTaskIds = tasks.filter(t => listIds.has(t.listId)).map(t => t.id);
      const idx = found.parent.findIndex(f => f.id === folderId);
      if (idx !== -1) found.parent.splice(idx, 1);
      tasks = tasks.filter(t => !listIds.has(t.listId));
      saveSpaces();
      syncSpacesToSupabase();
      saveTasks();
      if (deletedTaskIds.length) {
        Promise.resolve(supabaseClient.from('hs_tasks').delete().in('id', deletedTaskIds)).catch(err => console.error('Supabase task delete failed', err));
      }
      expandedFolders.delete(folderId);
      if (activeListId && listIds.has(activeListId)) {
        activeListId = null;
        document.getElementById('pageTitle').textContent = 'Select a list';
        document.getElementById('pageBreadcrumb').textContent = '';
      }
      renderSidebar();
      render();
    }

    function deleteList(listId) {
      const found = findList(listId);
      if (!found) return;
      if (!confirm('Delete list "' + found.list.name + '"?')) return;
      const idx = found.folder.lists.findIndex(l => l.id === listId);
      if (idx !== -1) found.folder.lists.splice(idx, 1);
      const deletedTaskIds = tasks.filter(t => t.listId === listId).map(t => t.id);
      tasks = tasks.filter(t => t.listId !== listId);
      saveSpaces();
      syncSpacesToSupabase();
      saveTasks();
      if (deletedTaskIds.length) {
        Promise.resolve(supabaseClient.from('hs_tasks').delete().in('id', deletedTaskIds)).catch(err => console.error('Supabase task delete failed', err));
      }
      if (activeListId === listId) {
        activeListId = null;
        document.getElementById('pageTitle').textContent = 'Select a list';
        document.getElementById('pageBreadcrumb').textContent = '';
      }
      renderSidebar();
      render();
    }

    function collectListIds(folder) {
      const set = new Set();
      (folder.lists || []).forEach(l => set.add(l.id));
      (folder.folders || []).forEach(sub => {
        collectListIds(sub).forEach(id => set.add(id));
      });
      return set;
    }

    const filterHidden = { students: new Set(), folders: new Set(), spaces: new Set() };

    function getFilteredTasks() {
      return tasks.filter(t => {
        if (filterHidden.students.has(t.assignee)) return false;
        const folderId = getListFolderId(t.listId);
        if (folderId && filterHidden.folders.has(folderId)) return false;
        const spaceId = getListSpaceId(t.listId);
        if (spaceId && filterHidden.spaces.has(spaceId)) return false;

      });

    function buildDropdownMenu(menuId, items, hiddenSet, getKey, getLabel) {
      const menu = document.getElementById(menuId);
      menu.innerHTML = '';
      items.forEach(item => {
        const key = getKey(item);
        const label = document.createElement('label');
        const cb = document.createElement('input');
        cb.type = 'checkbox';
        cb.checked = !hiddenSet.has(key);
        cb.addEventListener('change', () => {
          if (cb.checked) hiddenSet.delete(key); else hiddenSet.add(key);
          render();
        });
        label.appendChild(cb);
        label.appendChild(document.createTextNode(getLabel(item)));
        menu.appendChild(label);
      });
    }

    function toggleDropdown(btnId, menuId) {
      const menu = document.getElementById(menuId);
      const isOpen = menu.classList.contains('open');
      document.querySelectorAll('.filter-dropdown-menu').forEach(m => m.classList.remove('open'));
      if (!isOpen) menu.classList.add('open');
    }

    function getDisplayDate(task) {
      return task.dueDate || task.startDate;
    }

    function getDisplayTime(task, dateStr) {
      if (task.dueDate === dateStr) return task.dueTime || task.startTime || '';
      return task.startTime || task.dueTime || '';
    }

    function getDayTasks(dateStr, visibleTasks) {
      const list = [];
      visibleTasks.forEach(t => {
        const d = getDisplayDate(t);
        if (d === dateStr) {
          list.push({ task: t, time: getDisplayTime(t, dateStr) });
        }
      });
      list.sort((a, b) => {
        if (a.time && b.time) return a.time.localeCompare(b.time);
        if (a.time) return -1;
        if (b.time) return 1;
        return a.task.title.localeCompare(b.task.title);
      });
      return list.map(x => x.task);
    }

    function createCalendarTask(task, dateStr) {
      const time = getDisplayTime(task, dateStr);
      const el = document.createElement('div');
      const color = getListColor(task.listId, task.assignee);
      el.className = 'calendar-task';
      el.style.backgroundColor = color.bg;
      el.style.borderLeftColor = color.border;
      el.innerHTML = '<div>' + escapeHtml(task.title) + '</div>' +
        (time ? '<div class="time">' + time + '</div>' : '') +
        '<div><span class="badge priority-' + task.priority.toLowerCase() + '">' + task.priority + '</span></div>';
      el.addEventListener('click', () => openTask(task.id));
      return el;
    }

    function formatShortDate(d) {
      return d.getDate() + ' ' + MONTH_NAMES[d.getMonth()] + ' ' + d.getFullYear();
    }

    function renderCalendar() {
      _listColorCache = null;
      const grid = document.getElementById('calendarGrid');
      grid.innerHTML = '';
      document.getElementById('pageTitle').textContent = 'Calendar';
      document.getElementById('pageBreadcrumb').textContent = 'Schedule';

      const visibleTasks = getVisibleCalendarTasks();

      if (calendarMode === 'month') {
        grid.className = 'month-view';
        const months = [addMonths(calendarDate, -1), calendarDate, addMonths(calendarDate, 1)];
        months.forEach((m, idx) => {
          const panel = document.createElement('div');
          panel.className = 'month-panel';
          const monthGrid = document.createElement('div');
          monthGrid.className = 'calendar-grid';
          const startOfMonth = new Date(m.getFullYear(), m.getMonth(), 1);
          const gridStart = startOfWeek(startOfMonth);
          for (let i = 0; i < 42; i++) {
            const d = addDays(gridStart, i);
            const dateStr = toISODate(d);
            const isCurrentMonth = d.getMonth() === m.getMonth();
            const cell = document.createElement('div');
            cell.className = 'calendar-day' + (isCurrentMonth ? '' : ' calendar-other-month');
            cell.innerHTML = '<div class="day-label">' + DAY_NAMES[d.getDay()] + ' ' + d.getDate() + '</div>';
            const taskList = document.createElement('div');
            taskList.className = 'day-tasks';
            const dayTasks = getDayTasks(dateStr, visibleTasks);
            if (dayTasks.length === 0) {
              taskList.innerHTML = '<span style="color:#9ca3af;font-size:11px">No tasks</span>';
            } else {
              dayTasks.forEach(task => taskList.appendChild(createCalendarTask(task, dateStr)));
            }
            cell.appendChild(taskList);
            monthGrid.appendChild(cell);
          }
          panel.appendChild(monthGrid);
          grid.appendChild(panel);
        });
        setTimeout(() => { grid.scrollLeft = grid.clientWidth; }, 0);
        document.getElementById('calDateLabel').textContent = MONTH_NAMES[calendarDate.getMonth()] + ' ' + calendarDate.getFullYear();
      } else if (calendarMode === 'week') {
        const start = startOfWeek(calendarDate);
        grid.className = 'calendar-time-view week-view';
        const header = document.createElement('div');
        header.className = 'time-view-header';
        header.innerHTML = '<div class="time-gutter"></div>';
        const allDayRow = document.createElement('div');
        allDayRow.className = 'all-day-row';
        allDayRow.innerHTML = '<div class="all-day-label">All day</div><div class="all-day-cells"></div>';
        const allDayCells = allDayRow.querySelector('.all-day-cells');
        const weekColumns = document.createElement('div');
        weekColumns.className = 'week-columns';
        for (let i = 0; i < 7; i++) {
          const d = addDays(start, i);
          const dateStr = toISODate(d);
          const dayHeader = document.createElement('div');
          dayHeader.className = 'day-header-cell';
          dayHeader.innerHTML = '<span class="day-name">' + DAY_NAMES[d.getDay()] + '</span><span class="day-date">' + d.getDate() + '</span>';
          header.appendChild(dayHeader);
          const allDayCell = document.createElement('div');
          allDayCell.className = 'all-day-cell';
          const ranges = getDayTaskRanges(dateStr, visibleTasks);
          ranges.forEach(r => { if (r.allDay) allDayCell.appendChild(createTimeEvent(r.task, r.startMins, r.endMins, true)); });
          allDayCells.appendChild(allDayCell);
          const dayCol = document.createElement('div');
          dayCol.className = 'day-column';
          for (let h = 0; h < 24; h++) {
            const row = document.createElement('div');
            row.className = 'hour-row';
            dayCol.appendChild(row);
          }
          const dayEvents = [];
          ranges.forEach(r => {
            if (!r.allDay) {
              const el = createTimeEvent(r.task, r.startMins, r.endMins, false);
              dayCol.appendChild(el);
              dayEvents.push({ el, startMins: r.startMins, endMins: r.endMins });
            }
          });
          positionEvents(dayEvents);
          weekColumns.appendChild(dayCol);
        }
        grid.appendChild(header);
        if (allDayCells.querySelector('.calendar-event')) grid.appendChild(allDayRow);
        const timeGrid = document.createElement('div');
        timeGrid.className = 'time-grid';
        const gutter = document.createElement('div');
        gutter.className = 'time-gutter-col';
        for (let h = 0; h < 24; h++) {
          const slot = document.createElement('div');
          slot.className = 'time-slot';
          slot.textContent = formatHourLabel(h);
          gutter.appendChild(slot);
        }
        timeGrid.appendChild(gutter);
        timeGrid.appendChild(weekColumns);
        grid.appendChild(timeGrid);
        const end = addDays(start, 6);
        document.getElementById('calDateLabel').textContent = formatShortDate(start) + ' – ' + formatShortDate(end);
      } else if (calendarMode === 'day') {
        const dateStr = toISODate(calendarDate);
        grid.className = 'calendar-time-view day-view';
        const header = document.createElement('div');
        header.className = 'time-view-header';
        header.innerHTML = '<div class="time-gutter"></div><div class="day-header-cell"><span class="day-name">' + DAY_NAMES[calendarDate.getDay()] + '</span><span class="day-date">' + calendarDate.getDate() + '</span></div>';
        grid.appendChild(header);
        const ranges = getDayTaskRanges(dateStr, visibleTasks);
        const hasAllDay = ranges.some(r => r.allDay);
        if (hasAllDay) {
          const allDayRow = document.createElement('div');
          allDayRow.className = 'all-day-row';
          allDayRow.innerHTML = '<div class="all-day-label">All day</div><div class="all-day-cells"><div class="all-day-cell"></div></div>';
          const allDayCell = allDayRow.querySelector('.all-day-cell');
          ranges.forEach(r => { if (r.allDay) allDayCell.appendChild(createTimeEvent(r.task, r.startMins, r.endMins, true)); });
          grid.appendChild(allDayRow);
        }
        const dayCol = document.createElement('div');
        dayCol.className = 'day-column';
        for (let h = 0; h < 24; h++) {
          const row = document.createElement('div');
          row.className = 'hour-row';
          dayCol.appendChild(row);
        }
        const dayEvents = [];
        ranges.forEach(r => {
          if (!r.allDay) {
            const el = createTimeEvent(r.task, r.startMins, r.endMins, false);
            dayCol.appendChild(el);
            dayEvents.push({ el, startMins: r.startMins, endMins: r.endMins });
          }
        });
        positionEvents(dayEvents);
        const timeGrid = document.createElement('div');
        timeGrid.className = 'time-grid';
        const gutter = document.createElement('div');
        gutter.className = 'time-gutter-col';
        for (let h = 0; h < 24; h++) {
          const slot = document.createElement('div');
          slot.className = 'time-slot';
          slot.textContent = formatHourLabel(h);
          gutter.appendChild(slot);
        }
        timeGrid.appendChild(gutter);
        timeGrid.appendChild(dayCol);
        grid.appendChild(timeGrid);
        document.getElementById('calDateLabel').textContent = formatShortDate(calendarDate);
      }
    }

    // Date & Time Picker state and functions
    let datePickerInput = null;
    let datePickerSelected = null;
    let datePickerView = new Date();

    function openDatePicker(input) {
      datePickerInput = input;
      const val = input.value;
      if (val && /^\d{4}-\d{2}-\d{2}$/.test(val)) {
        const [y, m, d] = val.split('-').map(Number);
        datePickerSelected = new Date(y, m - 1, d);
        datePickerView = new Date(y, m - 1, d);
      } else {
        datePickerSelected = null;
        datePickerView = new Date();
      }
      document.getElementById('datePickerModal').classList.add('active');
      renderDatePicker();
    }

    function renderDatePicker() {
      const year = datePickerView.getFullYear();
      const month = datePickerView.getMonth();
      document.getElementById('dpMonthYear').textContent = MONTH_NAMES[month] + ' ' + year;
      const start = startOfWeek(new Date(year, month, 1));
      const daysEl = document.getElementById('dpDays');
      daysEl.innerHTML = '';
      const today = toISODate(new Date());
      const selectedStr = datePickerSelected ? toISODate(datePickerSelected) : null;
      for (let i = 0; i < 42; i++) {
        const d = addDays(start, i);
        const dateStr = toISODate(d);
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'day-cell' +
          (d.getMonth() !== month ? ' other' : '') +
          (dateStr === today ? ' today' : '') +
          (dateStr === selectedStr ? ' selected' : '');
        btn.textContent = d.getDate();
        btn.addEventListener('click', () => {
          datePickerSelected = d;
          renderDatePicker();
        });
        daysEl.appendChild(btn);
      }
    }

    function closeDatePicker() {
      document.getElementById('datePickerModal').classList.remove('active');
      datePickerInput = null;
    }

    let timePickerInput = null;
    let timePickerHour = 12;
    let timePickerMinute = 0;
    let timePickerAmPm = 'AM';
    let timePickerMode = 'hour';

    function openTimePicker(input) {
      timePickerInput = input;
      timePickerMode = 'hour';
      const val = input.value;
      if (val && /^\d{1,2}:\d{2}$/.test(val)) {
        const [h, m] = val.split(':').map(Number);
        const h24 = h % 24;
        timePickerMinute = m;
        timePickerAmPm = h24 < 12 ? 'AM' : 'PM';
        let h12 = h24 % 12;
        if (h12 === 0) h12 = 12;
        timePickerHour = h12;
      } else {
        const now = new Date();
        const h24 = now.getHours();
        timePickerMinute = now.getMinutes();
        timePickerAmPm = h24 < 12 ? 'AM' : 'PM';
        let h12 = h24 % 12;
        if (h12 === 0) h12 = 12;
        timePickerHour = h12;
      }
      document.getElementById('timePickerModal').classList.add('active');
      renderTimePicker();
    }

    function renderTimePicker() {
      document.getElementById('tpSub').textContent = timePickerMode === 'hour' ? 'SELECT HOUR' : 'SELECT MINUTE';
      document.getElementById('tpDisplay').textContent =
        String(timePickerHour).padStart(2, '0') + ':' + String(timePickerMinute).padStart(2, '0') + ' ' + timePickerAmPm;
      document.getElementById('tpAM').classList.toggle('active', timePickerAmPm === 'AM');
      document.getElementById('tpPM').classList.toggle('active', timePickerAmPm === 'PM');
      const dial = document.getElementById('tpDial');
      dial.innerHTML = '';
      // Both hour and minute dials show 12 evenly-spaced marks. Minutes snap to
      // 5-minute increments, which is precise enough for scheduling and keeps
      // the dial readable (60 crammed numbers is impractical to tap).
      const radius = 40;
      const step = timePickerMode === 'hour' ? 1 : 5;
      const nearestStep = Math.round(timePickerMinute / 5) * 5 % 60;
      for (let i = 0; i < 12; i++) {
        const n = timePickerMode === 'hour' ? (i === 0 ? 12 : i) : i * step;
        const angle = (i / 12 * 360) - 90;
        const rad = angle * Math.PI / 180;
        const x = 50 + Math.cos(rad) * radius;
        const y = 50 + Math.sin(rad) * radius;
        const btn = document.createElement('button');
        btn.type = 'button';
        const isSelected = timePickerMode === 'hour' ? n === timePickerHour : n === nearestStep;
        btn.className = 'dial-number' + (isSelected ? ' selected' : '');
        btn.textContent = timePickerMode === 'hour' ? n : String(n).padStart(2, '0');
        btn.style.left = x + '%';
        btn.style.top = y + '%';
        btn.addEventListener('click', () => {
          if (timePickerMode === 'hour') {
            timePickerHour = n;
            timePickerMode = 'minute';
            renderTimePicker();
          } else {
            timePickerMinute = n;
            renderTimePicker();
          }
        });
        dial.appendChild(btn);
      }
    }

    function closeTimePicker() {
      document.getElementById('timePickerModal').classList.remove('active');
      timePickerInput = null;
    }

    document.getElementById('dpPrev').addEventListener('click', () => { datePickerView = addMonths(datePickerView, -1); renderDatePicker(); });
    document.getElementById('dpNext').addEventListener('click', () => { datePickerView = addMonths(datePickerView, 1); renderDatePicker(); });
    document.getElementById('dpClear').addEventListener('click', () => { if (datePickerInput) datePickerInput.value = ''; closeDatePicker(); });
    document.getElementById('dpCancel').addEventListener('click', closeDatePicker);
    document.getElementById('dpDone').addEventListener('click', () => {
      if (datePickerInput && datePickerSelected) datePickerInput.value = toISODate(datePickerSelected);
      closeDatePicker();
    });
    document.getElementById('dpToday').addEventListener('click', () => {
      const now = new Date();
      datePickerSelected = now;
      datePickerView = new Date(now.getFullYear(), now.getMonth(), 1);
      renderDatePicker();
      if (datePickerInput) datePickerInput.value = toISODate(now);
      closeDatePicker();
    });
    document.getElementById('tpAM').addEventListener('click', () => { timePickerAmPm = 'AM'; renderTimePicker(); });
    document.getElementById('tpPM').addEventListener('click', () => { timePickerAmPm = 'PM'; renderTimePicker(); });
    document.getElementById('tpCancel').addEventListener('click', closeTimePicker);
    document.getElementById('tpDone').addEventListener('click', () => {
      if (timePickerInput) {
        let hour24 = timePickerHour;
        if (timePickerHour === 12) hour24 = timePickerAmPm === 'AM' ? 0 : 12;
        else hour24 = timePickerAmPm === 'AM' ? timePickerHour : timePickerHour + 12;
        timePickerInput.value = String(hour24).padStart(2, '0') + ':' + String(timePickerMinute).padStart(2, '0');
      }
      closeTimePicker();
    });
    document.getElementById('tStartDate').addEventListener('click', () => openDatePicker(document.getElementById('tStartDate')));
    document.getElementById('tDueDate').addEventListener('click', () => openDatePicker(document.getElementById('tDueDate')));
    document.getElementById('tStartTime').addEventListener('click', () => openTimePicker(document.getElementById('tStartTime')));
    document.getElementById('tDueTime').addEventListener('click', () => openTimePicker(document.getElementById('tDueTime')));

    async function init() {
      const { data: { session } } = await supabaseClient.auth.getSession();
      const email = session && session.user ? (session.user.email || '').toLowerCase() : '';
      if (email && userMap[email]) {
        currentUser = { ...session.user, name: userMap[email].name, role: userMap[email].role, email };
        // Force a fresh access token so any recent role/permission changes take effect immediately.
        supabaseClient.auth.refreshSession().catch(err => console.error('Session refresh failed', err));
        setViews();
        loadSpaces();
        loadTasks();
        if (!activeListId) {
          activeListId = 'pe-t3';
          expandedFolders.add('pe');
        }
        renderSidebar();
        selectList(activeListId);
      } else {
        setViews();
      }
    }

    init();
  </script>
</body>
</html>
