<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home Schooling & Sports Training Hub</title>
  <style>
    :root {
      --bg: #f4f5f8;
      --card: #ffffff;
      --text: #1a1f2b;
      --muted: #6b7280;
      --muted-light: #9ca3af;
      --primary: #7c3aed;
      --primary-dark: #5b21b6;
      --primary-light: #f2ecfe;
      --border: #e6e8ee;
      --todo: #f3f4f6;
      --progress: #dbeafe;
      --done: #d1fae5;
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --shadow-sm: 0 1px 2px rgba(16,24,40,0.06);
      --shadow: 0 4px 12px -2px rgba(16,24,40,0.08), 0 2px 4px -2px rgba(16,24,40,0.06);
      --shadow-lg: 0 12px 24px -6px rgba(16,24,40,0.14), 0 4px 8px -2px rgba(16,24,40,0.08);
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); -webkit-font-smoothing: antialiased; }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }

    .login-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; background: linear-gradient(160deg, #f4f5f8 0%, #efeafc 100%); }
    .login-card { background: var(--card); padding: 36px; border-radius: var(--radius-lg); box-shadow: var(--shadow-lg); width: 100%; max-width: 400px; border: 1px solid var(--border); }
    .login-card h1 { margin: 0 0 8px; font-size: 24px; letter-spacing: -0.01em; }
    .login-card p { margin: 0 0 24px; color: var(--muted); font-size: 14px; line-height: 1.5; }
    .field { margin-bottom: 16px; }
    .field label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: var(--text); }
    .field input, .field select, .field textarea { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: #fff; color: var(--text); transition: border-color 0.15s, box-shadow 0.15s; }
    .field input:focus, .field select:focus, .field textarea:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-light); }
    .field textarea { resize: vertical; }
    .btn { padding: 10px 18px; border: none; border-radius: var(--radius-sm); background: var(--primary); color: #fff; font-weight: 600; font-size: 14px; box-shadow: var(--shadow-sm); transition: background 0.15s, box-shadow 0.15s, transform 0.05s; }
    .btn:hover { background: var(--primary-dark); }
    .btn:active { transform: translateY(1px); }
    .btn-block { width: 100%; }
    .btn-danger { background: #ef4444; }
    .btn-danger:hover { background: #b91c1c; }
    .btn-ghost { background: transparent; color: var(--primary); border: 1px solid var(--border); box-shadow: none; }
    .btn-ghost:hover { background: var(--primary-light); border-color: var(--primary); }
    .btn-sm { padding: 7px 12px; font-size: 12.5px; }
    .error { color: #dc2626; font-size: 13px; margin-top: 10px; padding: 8px 10px; background: #fef2f2; border-radius: var(--radius-sm); }
    .hint { margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--border); font-size: 12px; color: var(--muted); line-height: 1.6; }

    .app { display: none; min-height: 100vh; }
    .app.active { display: flex; }
    .sidebar { width: 280px; background: var(--card); border-right: 1px solid var(--border); display: flex; flex-direction: column; }
    .sidebar-head { padding: 18px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
    .sidebar-head h2 { margin: 0; font-size: 16px; font-weight: 700; letter-spacing: -0.01em; }
    .sidebar-tree { flex: 1; overflow-y: auto; padding: 14px 12px; }
    .tree-space { margin-bottom: 18px; }
    .space-header { display: flex; align-items: center; justify-content: space-between; padding: 0 4px; }
    .space-name { font-weight: 700; font-size: 11.5px; color: var(--muted); padding: 6px 0; text-transform: uppercase; letter-spacing: 0.06em; }
    .space-add-btn { width: 22px; height: 22px; padding: 0; border: none; border-radius: 6px; background: transparent; color: var(--muted); font-size: 15px; line-height: 1; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background 0.15s, color 0.15s; }
    .space-add-btn:hover { background: var(--primary-light); color: var(--primary); }
    .tree-folder { margin-left: 4px; }
    .folder-row { display: flex; align-items: center; gap: 6px; padding: 7px 8px; border-radius: var(--radius-sm); color: var(--text); font-size: 13.5px; font-weight: 500; position: relative; transition: background 0.12s; }
    .folder-row:hover, .folder-row.active { background: var(--bg); }
    .chevron { width: 14px; text-align: center; color: var(--muted-light); font-size: 10px; }
    .folder-icon { color: var(--muted-light); font-size: 13px; }
    .folder-name { flex: 1; }
    .tree-lists { margin-left: 20px; display: none; border-left: 1px solid var(--border); padding-left: 8px; }
    .tree-lists.open { display: block; }
    .list-row { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: var(--radius-sm); font-size: 13px; color: var(--muted); cursor: pointer; position: relative; transition: background 0.12s, color 0.12s; }
    .list-row:hover { background: var(--bg); color: var(--text); }
    .list-row.active { background: var(--primary-light); color: var(--primary-dark); font-weight: 600; }
    .list-row .count { font-size: 10.5px; background: var(--bg); color: var(--muted); padding: 1px 7px; border-radius: 10px; font-weight: 600; }
    .list-row.active .count { background: #fff; color: var(--primary); }
    .sidebar-actions { padding: 12px; border-top: 1px solid var(--border); display: flex; gap: 8px; }
    .sidebar-actions button { flex: 1; font-size: 12px; padding: 8px; }

    .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
    .header { background: var(--card); border-bottom: 1px solid var(--border); padding: 16px 28px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
    .header h2 { margin: 0; font-size: 19px; font-weight: 700; letter-spacing: -0.01em; }
    .breadcrumb { font-size: 12.5px; color: var(--muted); margin-top: 3px; }
    .header .meta { display: flex; align-items: center; gap: 14px; }
    #userLabel { font-size: 13.5px; font-weight: 600; color: var(--text); background: var(--bg); padding: 7px 14px; border-radius: 20px; }
    .view-switcher { display: flex; align-items: center; gap: 4px; margin-top: 10px; flex-wrap: wrap; background: var(--bg); padding: 4px; border-radius: 10px; width: fit-content; }
    .view-switcher button { padding: 6px 14px; border: none; background: transparent; border-radius: 7px; font-size: 12.5px; font-weight: 600; color: var(--muted); transition: background 0.15s, color 0.15s; }
    .view-switcher button:hover:not(.active):not(:disabled) { color: var(--text); }
    .view-switcher button.active { background: #fff; color: var(--primary); box-shadow: var(--shadow-sm); }
    .view-switcher button:disabled { opacity: 0.4; cursor: not-allowed; }
    .view-sep { width: 1px; height: 16px; background: var(--border); margin: 0 4px; }
    .calendar-nav { display: none; align-items: center; gap: 8px; }
    .date-label { font-size: 14px; font-weight: 600; min-width: 120px; text-align: center; }

    .board { flex: 1; padding: 28px; overflow-x: auto; display: block; }
    .columns { display: grid; grid-template-columns: repeat(5, minmax(240px, 1fr)); gap: 18px; min-width: 1200px; }
    .column { background: var(--bg); border-radius: var(--radius-md); padding: 16px; border: 1px solid var(--border); }
    .column h3 { margin: 0 0 14px; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); display: flex; align-items: center; gap: 6px; }
    .tasks { display: flex; flex-direction: column; gap: 10px; }
    .task { background: var(--card); border-radius: var(--radius-md); padding: 14px 16px; box-shadow: var(--shadow-sm); cursor: pointer; border: 1px solid var(--border); transition: box-shadow 0.15s, transform 0.1s, border-color 0.15s; }
    .task:hover { box-shadow: var(--shadow); transform: translateY(-2px); border-color: transparent; }
    .task-title { font-weight: 600; margin-bottom: 10px; font-size: 13.5px; line-height: 1.4; }
    .task-meta { font-size: 12px; color: var(--muted); display: flex; flex-direction: column; gap: 5px; }
    .badge { display: inline-block; padding: 2px 9px; border-radius: 12px; font-size: 10.5px; font-weight: 700; letter-spacing: 0.02em; }
    .priority-high { background: #fee2e2; color: #991b1b; }
    .priority-medium { background: #fef3c7; color: #92400e; }
    .priority-low { background: #d1fae5; color: #065f46; }
    .priority-optional { background: #e0e7ff; color: #3730a3; }
    .empty { color: var(--muted-light); font-size: 12.5px; text-align: center; padding: 24px 0; border: 1px dashed var(--border); border-radius: var(--radius-sm); }

    .fab { position: fixed; bottom: 28px; right: 28px; width: 56px; height: 56px; border-radius: 50%; background: var(--primary); color: #fff; font-size: 26px; border: none; box-shadow: var(--shadow-lg); display: flex; align-items: center; justify-content: center; transition: background 0.15s, transform 0.1s; }
    .fab:hover { background: var(--primary-dark); transform: scale(1.05); }
    .hidden { display: none !important; }

    .modal-overlay { position: fixed; inset: 0; background: rgba(17,20,29,0.5); backdrop-filter: blur(2px); display: none; align-items: center; justify-content: center; z-index: 100; padding: 20px; }
    .modal-overlay.active { display: flex; }
    .modal { background: var(--card); border-radius: var(--radius-lg); width: 100%; max-width: 540px; max-height: 90vh; overflow-y: auto; box-shadow: var(--shadow-lg); }
    .modal-header { padding: 20px 24px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
    .modal-header h3 { margin: 0; font-size: 16px; font-weight: 700; }
    .modal-body { padding: 22px 24px; }
    .modal-footer { padding: 16px 24px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 10px; align-items: center; }
    .close { background: transparent; border: none; font-size: 22px; line-height: 1; color: var(--muted); width: 32px; height: 32px; border-radius: 8px; transition: background 0.15s; }
    .close:hover { background: var(--bg); color: var(--text); }

    .calendar { flex: 1; padding: 28px; overflow-y: auto; display: none; }
    .calendar.active { display: block; }
    .calendar-toolbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; flex-wrap: wrap; gap: 12px; }
    .calendar-toolbar .group { display: flex; align-items: center; gap: 8px; }
    .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 10px; }
    .calendar-day { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 10px; min-height: 120px; transition: box-shadow 0.15s; }
    .calendar-day .day-label { font-size: 12.5px; font-weight: 700; color: var(--muted); margin-bottom: 8px; }
    .calendar-day .day-tasks { display: flex; flex-direction: column; gap: 6px; }
    .calendar-task { padding: 6px 8px; border-radius: 6px; background: var(--bg); font-size: 12px; cursor: pointer; border-left: 3px solid var(--primary); transition: background 0.12s; }
    .calendar-task:hover { background: var(--primary-light); }
    .calendar-task .time { color: var(--muted); font-size: 11px; }
    .calendar-other-month { opacity: 0.55; background: #fafafa; }
    .calendar-week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 10px; }
    .calendar-day-view { max-width: 720px; }
    .calendar-day-view .day-header { font-size: 18px; font-weight: 700; margin-bottom: 16px; }
    .calendar-day-view .day-task { padding: 14px; border: 1px solid var(--border); border-radius: var(--radius-sm); margin-bottom: 8px; background: var(--card); cursor: pointer; transition: box-shadow 0.15s, border-color 0.15s; }
    .calendar-day-view .day-task:hover { box-shadow: var(--shadow-sm); border-color: var(--primary); }

    .pdf-preview { padding: 40px; line-height: 1.6; }
    .pdf-preview h1 { font-size: 22px; margin-bottom: 8px; }
    .pdf-preview .meta { color: #555; font-size: 13px; margin-bottom: 24px; }
    .pdf-preview .section { margin-bottom: 20px; }
    .pdf-preview .section h4 { margin: 0 0 6px; font-size: 13px; text-transform: uppercase; color: #777; }
    .pdf-preview .section p { margin: 0; white-space: pre-wrap; }

    .picker-modal { max-width: 380px; overflow: visible; }
    .picker-header { display: flex; align-items: center; justify-content: space-between; padding: 18px 20px; border-bottom: 1px solid var(--border); }
    .picker-title { font-weight: 700; font-size: 15px; }
    .picker-arrow { background: transparent; border: 1px solid var(--border); border-radius: 8px; width: 32px; height: 32px; color: var(--primary); font-weight: 700; cursor: pointer; transition: background 0.15s; }
    .picker-arrow:hover { background: var(--bg); }
    .picker-dow { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; font-size: 11.5px; font-weight: 600; color: var(--muted-light); padding: 14px 16px 0; }
    .picker-days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; padding: 8px 16px 16px; }
    .day-cell { aspect-ratio: 1; display: flex; align-items: center; justify-content: center; border-radius: 50%; border: none; background: transparent; font-size: 13px; color: var(--text); cursor: pointer; padding: 0; transition: background 0.12s; }
    .day-cell:hover { background: var(--bg); }
    .day-cell.other { color: var(--muted-light); opacity: 0.6; }
    .day-cell.today { box-shadow: inset 0 0 0 2px var(--primary); font-weight: 700; }
    .day-cell.selected { background: var(--primary); color: #fff; }
    .picker-footer { display: flex; gap: 8px; padding: 14px 16px 18px; border-top: 1px solid var(--border); }
    .picker-btn { flex: 1; padding: 10px; border-radius: var(--radius-sm); font-weight: 600; font-size: 13px; background: transparent; cursor: pointer; transition: background 0.15s; }
    .picker-dashed { border: 1px dashed var(--primary); color: var(--primary); }
    .picker-dashed:hover { background: var(--primary-light); }
    .picker-primary { background: var(--primary); color: #fff; border: 1px solid var(--primary); }
    .picker-primary:hover { background: var(--primary-dark); }
    .time-picker { text-align: center; }
    .time-display { font-size: 42px; font-weight: 300; padding: 26px 0 6px; font-variant-numeric: tabular-nums; color: var(--text); }
    .time-sub { font-size: 11px; font-weight: 600; letter-spacing: 0.1em; color: var(--muted-light); margin-bottom: 14px; }
    .time-ampm { display: flex; justify-content: center; gap: 8px; margin-bottom: 18px; }
    .ampm-btn { padding: 6px 18px; border: 1px solid var(--border); border-radius: 20px; background: transparent; color: var(--text); cursor: pointer; font-weight: 600; font-size: 12.5px; transition: background 0.15s, color 0.15s, border-color 0.15s; }
    .ampm-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }
    .time-dial { width: 260px; height: 260px; margin: 0 auto 18px; position: relative; border-radius: 50%; border: 1px solid var(--border); background: var(--bg); }
    .dial-number { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 38px; height: 38px; border-radius: 50%; border: none; background: transparent; font-size: 14px; font-weight: 600; color: var(--text); cursor: pointer; transition: background 0.12s, color 0.12s; }
    .dial-number:hover { background: #fff; }
    .dial-number.selected { background: var(--primary); color: #fff; }

    @media (max-width: 900px) {
      .columns { grid-template-columns: 1fr; min-width: auto; }
      .calendar-grid { grid-template-columns: repeat(2, 1fr); }
      .calendar-week { grid-template-columns: 1fr; }
      .header { flex-direction: column; align-items: flex-start; gap: 10px; }
      .calendar-nav { margin-top: 8px; }
    }

    @media print {
      body * { visibility: hidden; }
      #printArea, #printArea * { visibility: visible; }
      #printArea { position: absolute; left: 0; top: 0; width: 100%; }
    }
    .folder-body { display: none; }
    .folder-body.open { display: block; }
    .folder-children { margin-left: 12px; }
    .list-name { flex: 1; }
    .menu-btn { width: 24px; height: 24px; padding: 0; border: none; border-radius: 6px; background: transparent; color: var(--muted-light); font-size: 14px; line-height: 1; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background 0.15s, color 0.15s; }
    .menu-btn:hover, .menu-btn.active { background: var(--primary-light); color: var(--primary); }
    .dropdown-menu { position: fixed; z-index: 200; min-width: 160px; background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-sm); box-shadow: var(--shadow-lg); padding: 6px; display: flex; flex-direction: column; gap: 1px; }
    .dropdown-item { padding: 8px 10px; font-size: 13px; font-weight: 500; color: var(--text); background: transparent; border: none; border-radius: 6px; text-align: left; cursor: pointer; transition: background 0.12s; }
    .dropdown-item:hover { background: var(--primary-light); color: var(--primary-dark); }
    .dropdown-item.danger { color: #ef4444; }
    .dropdown-item.danger:hover { background: #fee2e2; color: #b91c1c; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
</head>
<body>
  <div id="login" class="login-wrap">
    <div class="login-card">
      <h1>Training Hub</h1>
      <p>Log in to manage home schooling and sports training.</p>
      <form id="loginForm">
        <div class="field">
          <label for="username">Email</label>
          <input id="username" name="username" placeholder="Enter email" required>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" type="password" name="password" placeholder="Enter password" required>
        </div>
        <button type="submit" class="btn btn-block">Log In</button>
        <div id="loginError" class="error" style="display:none">Invalid credentials.</div>
      </form>
      <div class="hint">
        Sign in with your registered email address and password.
      </div>
    </div>
  </div>

  <div id="app" class="app">
    <aside class="sidebar">
      <div class="sidebar-head">
        <h2>Spaces</h2>
      </div>
      <div class="sidebar-tree" id="sidebarTree"></div>
      <div class="sidebar-actions" id="sidebarActions">
        <button id="addFolderBtn" class="btn btn-ghost btn-sm hidden">+ Folder</button>
        <button id="addListBtn" class="btn btn-ghost btn-sm hidden">+ List</button>
      </div>
    </aside>
    <main class="main">
      <header class="header">
        <div>
          <h2 id="pageTitle">Home School</h2>
          <div class="breadcrumb" id="pageBreadcrumb">Mathematics / Term One 2026 Lessons</div>
          <div class="view-switcher" id="viewSwitcher">
            <button type="button" id="viewBoard" class="active">Board</button>
            <button type="button" id="viewCalendar">Calendar</button>
            <span class="view-sep">|</span>
            <button type="button" id="calDay" disabled>Day</button>
            <button type="button" id="calWeek" disabled>Week</button>
            <button type="button" id="calMonth" disabled>Month</button>
          </div>
        </div>
        <div class="calendar-nav" id="calendarNav">
          <button type="button" id="calPrev" class="btn btn-sm btn-ghost">&lt;</button>
          <button type="button" id="calToday" class="btn btn-sm">Today</button>
          <button type="button" id="calNext" class="btn btn-sm btn-ghost">&gt;</button>
          <span class="date-label" id="calDateLabel"></span>
        </div>
        <div class="meta">
          <span id="userLabel">User</span>
          <button id="logoutBtn" class="btn">Log Out</button>
        </div>
      </header>
      <div class="board" id="board">
        <div class="columns" id="boardColumns"></div>
      </div>
      <div class="calendar" id="calendarView">
        <div id="calendarGrid"></div>
      </div>
    </main>
    <button id="addTaskBtn" class="fab hidden" title="Add task">+</button>
  </div>

  <div id="modal" class="modal-overlay">
    <div class="modal">
      <div class="modal-header">
        <h3 id="modalTitle">Task</h3>
        <button class="close" id="closeModal" aria-label="Close">&times;</button>
      </div>
      <form id="taskForm" class="modal-body">
        <div class="field">
          <label for="tTitle">Title</label>
          <input id="tTitle" required>
        </div>
        <div class="field">
          <label for="tList">List</label>
          <select id="tList"></select>
        </div>
        <div class="field">
          <label for="tStatus">Status</label>
          <select id="tStatus"></select>
        </div>
        <div class="field">
          <label for="tAssignee">Assignee</label>
          <select id="tAssignee"></select>
        </div>
        <div class="field">
          <label for="tPriority">Priority</label>
          <select id="tPriority"></select>
        </div>
        <div class="field">
          <label for="tStartDate">Start Date</label>
          <input id="tStartDate" type="text" data-picker="date" placeholder="YYYY-MM-DD" readonly>
        </div>
        <div class="field">
          <label for="tStartTime">Start Time</label>
          <input id="tStartTime" type="text" data-picker="time" placeholder="HH:MM" readonly>
        </div>
        <div class="field">
          <label for="tDueDate">Due Date</label>
          <input id="tDueDate" type="text" data-picker="date" placeholder="YYYY-MM-DD" readonly>
        </div>
        <div class="field">
          <label for="tDueTime">Due Time</label>
          <input id="tDueTime" type="text" data-picker="time" placeholder="HH:MM" readonly>
        </div>
        <div class="field">
          <label for="tDesc">Description</label>
          <textarea id="tDesc" rows="3"></textarea>
        </div>
        <div class="field">
          <label for="tNotes">Notes</label>
          <textarea id="tNotes" rows="4" placeholder="Add notes, observations, or lesson feedback here..."></textarea>
        </div>
      </form>
      <div class="modal-footer">
        <button id="printNotesBtn" type="button" class="btn btn-ghost hidden">Save Notes as PDF</button>
        <button id="deleteTaskBtn" type="button" class="btn btn-danger hidden">Delete</button>
        <div style="flex:1"></div>
        <button id="cancelModal" type="button" class="btn btn-ghost">Cancel</button>
        <button id="saveTaskBtn" type="button" class="btn">Save</button>
      </div>
    </div>
  </div>

  <div id="printArea" class="pdf-preview" style="display:none"></div>

  <div id="datePickerModal" class="modal-overlay">
    <div class="modal picker-modal">
      <div class="picker-header">

    const supabaseClient = window.supabase.createClient('https://zbmktdoivzlapmaccwvh.supabase.co', 'sb_publishable_W3BXowc4pBBP_o2VCL_EhQ_-0q80ssj');

    let currentUser = null;

    function seedTasks() {
      const today = new Date().toISOString().split('T')[0];
      const future = new Date(Date.now() + 7 * 24 * 60 * 60 * 1000).toISOString().split('T')[0];
      return [
        { id: generateId(), title: 'Math worksheet', listId: 'math-t1', status: 'Planned', assignee: 'student1', priority: 'High', startDate: today, startTime: '', dueDate: today, dueTime: '', desc: 'Complete algebra worksheet p.12', notes: '' },
        { id: generateId(), title: 'Read history chapter', listId: 'english-t2', status: 'In Progress', assignee: 'student2', priority: 'Medium', startDate: today, startTime: '', dueDate: future, dueTime: '', desc: 'Chapter 4: Ancient Rome', notes: '' },
        { id: generateId(), title: 'T03W06S01: Physical Education - Midday Sport (UAC Basketball)!', listId: 'pe-t3', status: 'Planned', assignee: 'student1', priority: 'Medium', startDate: today, startTime: '', dueDate: today, dueTime: '', desc: 'Midday basketball session at UAC.', notes: 'Arrived on time. Focused on passing drills and defence. Next session: work on shooting form.' },
        { id: generateId(), title: 'Daily 5k run', listId: 'sporting-t3', status: 'Planned', assignee: 'student1', priority: 'Medium', startDate: today, startTime: '', dueDate: today, dueTime: '', desc: 'Keep steady pace, log time', notes: '' },
        { id: generateId(), title: 'Stretching routine', listId: 'sporting-t3-afternoon', status: 'Completed', assignee: 'student2', priority: 'Low', startDate: today, startTime: '', dueDate: today, dueTime: '', desc: '15 min post-workout stretch', notes: '' }
      ];

    function generateId() { return Math.random().toString(36).slice(2) + Date.now().toString(36); }

    function loadSpaces() {
      const raw = localStorage.getItem(SPACE_KEY);
      spaces = raw ? JSON.parse(raw) : seedSpaces();
      if (!raw) saveSpaces();
      else migrateSpaces();
      syncSpacesFromSupabase();
    }

    async function syncSpacesFromSupabase() {
      try {
        const { data: rows, error } = await supabaseClient.from('hs_spaces').select('*').eq('id', 'main');
        if (error) throw error;
        if (rows && rows.length && rows[0].data && Array.isArray(rows[0].data)) {
          spaces = rows[0].data;
          localStorage.setItem(SPACE_KEY, JSON.stringify(spaces));
          migrateSpaces();
          if (currentUser) { renderSidebar(); if (activeListId) selectList(activeListId); }
        } else {
          saveSpaces();
        }
      } catch (err) { console.error('Supabase sync spaces failed', err); }
    }

    function migrateSpaces() {
      function walk(folders) {
        (folders || []).forEach(f => {
          if (!Array.isArray(f.folders)) f.folders = [];
          if (!Array.isArray(f.lists)) f.lists = [];
          walk(f.folders);
        });
      }
      spaces.forEach(s => walk(s.folders));
      saveSpaces();
    }

    function saveSpaces() {
      localStorage.setItem(SPACE_KEY, JSON.stringify(spaces));
    }

    async function syncSpacesToSupabase() {
      try {
        const { error } = await supabaseClient.from('hs_spaces').upsert({ id: 'main', data: spaces });
        if (error) throw error;
      } catch (err) { console.error('Supabase spaces sync failed', err); }
    }

    function migrateTaskFields(arr) {
      arr.forEach(t => {
        if (t.assignee && legacyToEmail[t.assignee]) t.assignee = legacyToEmail[t.assignee];
        if (t.due && !t.dueDate) { t.dueDate = t.due; t.dueTime = ''; }
        if (t.due !== undefined) delete t.due;
        if (!t.startDate && t.dueDate) t.startDate = t.dueDate;
        if (t.startTime === undefined) t.startTime = '';
        if (t.dueTime === undefined) t.dueTime = '';
        if (!t.status) t.status = 'Planned';
        if (!t.priority) t.priority = 'Medium';
        if (t.desc === undefined) t.desc = '';
        if (t.notes === undefined) t.notes = '';
      });
      return arr;
    }

    function loadTasks() {
      const raw = localStorage.getItem(STORAGE_KEY);
      let arr = raw ? JSON.parse(raw) : seedTasks();
      migrateTaskFields(arr);
      tasks = arr;
      saveTasks();
      syncTasksFromSupabase();
    }

    async function syncTasksFromSupabase() {
      try {
        const { data: rows, error } = await supabaseClient.from('hs_tasks').select('*');
        if (error) throw error;
        if (rows && rows.length) {
          const arr = rows.map(row => {
            const d = (row && row.data) || {};
            return { ...d, id: d.id || row.id };
          }).filter(t => t.id);
          migrateTaskFields(arr);
          tasks = arr;
          localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
          if (currentUser) {
            renderSidebar();
            if (currentView === 'board') renderBoard(); else if (currentView === 'calendar') renderCalendar();
          }
        } else {
          saveTasks();
        }
      } catch (err) { console.error('Supabase sync tasks failed', err); }
    }

    function saveTasks() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
    }

    function findList(listId) {
      for (const space of spaces) {
        const res = findListInFolders(listId, space.folders, [], space);
        if (res) return res;
      }
      return null;
    }

    function findListInFolders(listId, folders, ancestors, space) {
      for (const folder of (folders || [])) {
        for (const list of (folder.lists || [])) {
          if (list.id === listId) return { space, ancestors: [...ancestors], folder, list };
        }
        const nested = findListInFolders(listId, folder.folders, [...ancestors, folder], space);
        if (nested) return nested;
      }
      return null;
    }

    function setViews() {
      if (currentUser) {
        document.getElementById('login').style.display = 'none';
        document.getElementById('app').classList.add('active');
        document.getElementById('userLabel').textContent = currentUser.name + ' (' + currentUser.role + ')';
        document.getElementById('addTaskBtn').classList.toggle('hidden', currentUser.role !== 'manager');
        document.getElementById('addFolderBtn').classList.toggle('hidden', currentUser.role !== 'manager');
        document.getElementById('addListBtn').classList.toggle('hidden', currentUser.role !== 'manager');
      } else {
        document.getElementById('login').style.display = 'flex';
        document.getElementById('app').classList.remove('active');
      }
    }

    function getTaskCount(listId) {
      return tasks.filter(t => t.listId === listId).length;
    }

    function renderSidebar() {
      const tree = document.getElementById('sidebarTree');
      tree.innerHTML = '';
      spaces.forEach(space => {
        const spaceEl = document.createElement('div');
        spaceEl.className = 'tree-space';
        const header = document.createElement('div');
        header.className = 'space-header';
        header.innerHTML = '<div class="space-name">' + escapeHtml(space.name) + '</div>';
        if (currentUser.role === 'manager') {
          const addBtn = document.createElement('button');
          addBtn.type = 'button';
          addBtn.className = 'space-add-btn';
          addBtn.innerHTML = '&#43;';
          addBtn.title = 'Add folder to ' + space.name;
          addBtn.addEventListener('click', () => promptAddFolderToSpace(space.id));
          header.appendChild(addBtn);
        }
        spaceEl.appendChild(header);
        const folderContainer = document.createElement('div');
        folderContainer.className = 'tree-folders';
        (space.folders || []).forEach(folder => renderFolder(folder, folderContainer));
        spaceEl.appendChild(folderContainer);
        tree.appendChild(spaceEl);
      });
    }

    function renderFolder(folder, parentEl) {
      const isOpen = expandedFolders.has(folder.id);
      const folderEl = document.createElement('div');
      folderEl.className = 'tree-folder';

      const row = document.createElement('div');
      row.className = 'folder-row';
      row.dataset.folder = folder.id;
      row.innerHTML = '<span class="chevron">' + (isOpen ? '&#9662;' : '&#9656;') + '</span>' +
        '<span class="folder-icon">&#128193;</span>' +
        '<span class="folder-name">' + escapeHtml(folder.name) + '</span>';
      if (currentUser.role === 'manager') {
        const menuBtn = document.createElement('button');
        menuBtn.type = 'button';
        menuBtn.className = 'menu-btn';
        menuBtn.innerHTML = '&#x22EE;';
        menuBtn.title = 'Actions';
        menuBtn.addEventListener('click', e => { e.stopPropagation(); toggleDropdown(menuBtn, 'folder', folder.id); });
        row.appendChild(menuBtn);
      }
      row.addEventListener('click', e => { if (e.target.closest('.menu-btn, .dropdown-menu')) return; toggleFolder(folder.id); });
      folderEl.appendChild(row);

      const body = document.createElement('div');
      body.className = 'folder-body' + (isOpen ? ' open' : '');
      const childFolders = document.createElement('div');
      childFolders.className = 'folder-children';
      (folder.folders || []).forEach(sub => renderFolder(sub, childFolders));
      body.appendChild(childFolders);

      const listContainer = document.createElement('div');
      listContainer.className = 'tree-lists' + (isOpen ? ' open' : '');
      (folder.lists || []).forEach(list => {
        const listRow = document.createElement('div');
        listRow.className = 'list-row' + (activeListId === list.id ? ' active' : '');
        listRow.innerHTML = '<span class="list-name">' + escapeHtml(list.name) + '</span>' +
          '<span class="count">' + getTaskCount(list.id) + '</span>';
        if (currentUser.role === 'manager') {
          const menuBtn = document.createElement('button');
          menuBtn.type = 'button';
          menuBtn.className = 'menu-btn';
          menuBtn.innerHTML = '&#x22EE;';
          menuBtn.title = 'Actions';
          menuBtn.addEventListener('click', e => { e.stopPropagation(); toggleDropdown(menuBtn, 'list', list.id); });
          listRow.appendChild(menuBtn);
        }
        listRow.addEventListener('click', e => { if (e.target.closest('.menu-btn, .dropdown-menu')) return; selectList(list.id); });
        listContainer.appendChild(listRow);
      });
      body.appendChild(listContainer);
      folderEl.appendChild(body);
      parentEl.appendChild(folderEl);
    }

    function onFolderAction(action, folderId) {
      if (action === 'add-subfolder') promptAddSubfolder(folderId);
      else if (action === 'add-list') promptAddListToFolder(folderId);
      else if (action === 'rename-folder') renameFolder(folderId);
      else if (action === 'delete-folder') deleteFolder(folderId);
    }

    function onListAction(action, listId) {
      if (action === 'rename-list') renameList(listId);
      else if (action === 'delete-list') deleteList(listId);
    }

    function closeAllDropdowns() {
      document.querySelectorAll('.dropdown-menu').forEach(d => d.remove());
      document.querySelectorAll('.menu-btn.active').forEach(b => b.classList.remove('active'));
    }

    function toggleDropdown(btn, type, id) {
      if (btn.classList.contains('active')) {
        closeAllDropdowns();
        return;
      }
      closeAllDropdowns();
      btn.classList.add('active');
      const dropdown = document.createElement('div');
      dropdown.className = 'dropdown-menu';
      dropdown.addEventListener('click', e => e.stopPropagation());
      const items = type === 'folder' ? [
        { action: 'add-subfolder', label: 'Add Subfolder' },
        { action: 'add-list', label: 'Add List' },
        { action: 'rename-folder', label: 'Rename' },
        { action: 'delete-folder', label: 'Delete', danger: true }
      ] : [
        { action: 'rename-list', label: 'Rename' },
        { action: 'delete-list', label: 'Delete', danger: true }
      ];
      items.forEach(item => {
        const el = document.createElement('button');
        el.type = 'button';
        el.className = 'dropdown-item' + (item.danger ? ' danger' : '');
        el.textContent = item.label;
        el.addEventListener('click', e => {
          e.stopPropagation();
          closeAllDropdowns();
          if (type === 'folder') onFolderAction(item.action, id);
          else onListAction(item.action, id);
        });
        dropdown.appendChild(el);
      });
      const rect = btn.getBoundingClientRect();
      const width = 150;
      dropdown.style.top = (rect.bottom + 4) + 'px';
      dropdown.style.left = Math.max(4, Math.min(window.innerWidth - width - 4, rect.right - width)) + 'px';
      document.body.appendChild(dropdown);
    }

    function toggleFolder(folderId) {
      if (expandedFolders.has(folderId)) expandedFolders.delete(folderId);
      else expandedFolders.add(folderId);
      renderSidebar();
    }

    function selectList(listId) {
      activeListId = listId;
      const found = findList(listId);
      if (found) {
        document.getElementById('pageTitle').textContent = found.list.name;
        const path = [found.space.name]
          .concat(found.ancestors.map(f => f.name), [found.folder.name, found.list.name])
          .join(' / ');
        document.getElementById('pageBreadcrumb').textContent = path;
      }
      switchView('board');
    }

    function toISODate(d) {
      return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    }

    function addDays(d, days) { const r = new Date(d); r.setDate(r.getDate() + days); return r; }
    function addMonths(d, m) { const r = new Date(d); r.setMonth(r.getMonth() + m); return r; }
    function startOfWeek(d) { const r = new Date(d.getFullYear(), d.getMonth(), d.getDate()); r.setDate(r.getDate() - r.getDay()); return r; }

    function formatDateTime(date, time) {
      if (!date) return '—';
      return time ? date + ' at ' + time : date;
    }

    function escapeHtml(s) {
      return s.split('').map(c => {
        if (c === '&') return '&amp;';
        if (c === '<') return '&lt;';
        if (c === '>') return '&gt;';
        if (c === '"') return '&quot;';
        if (c === "'") return '&#39;';
        return c;
      }).join('');
    }

    function renderBoard() {
      const board = document.getElementById('boardColumns');
      board.innerHTML = '';
      if (!activeListId) return;
      statuses.forEach(status => {
        const col = document.createElement('div');
        col.className = 'column';
        col.innerHTML = '<h3>' + status + '</h3>';
        const list = document.createElement('div');
        list.className = 'tasks';
        const filtered = tasks.filter(t => t.listId === activeListId && t.status === status);
        if (filtered.length === 0) {
          list.innerHTML = '<div class="empty">No tasks</div>';
        } else {
          filtered.forEach(task => {
            const el = document.createElement('div');
            el.className = 'task';
            el.dataset.id = task.id;
            const priorityClass = 'priority-' + task.priority.toLowerCase();
            el.innerHTML = '<div class="task-title">' + escapeHtml(task.title) + '</div>' +
              '<div class="task-meta">' +
              '<span>Assignee: ' + (userMap[task.assignee]?.name || task.assignee) + '</span>' +
              '<span>Due: ' + formatDateTime(task.dueDate, task.dueTime) + '</span>' +
              '<span><span class="badge ' + priorityClass + '">' + task.priority + '</span>' + (task.notes ? ' &bull; Notes' : '') + '</span>' +
              '</div>';
            el.addEventListener('click', () => openTask(task.id));
            list.appendChild(el);
          });
        }
        col.appendChild(list);
        board.appendChild(col);
      });
    }

    function buildListOptions() {
      const opts = [];
      spaces.forEach(space => {
        addFolderListOptions(space.folders, [space.name], opts);
      });
      return opts;
    }

    function addFolderListOptions(folders, path, opts) {
      for (const folder of (folders || [])) {
        const folderPath = path.concat(folder.name);
        for (const list of (folder.lists || [])) {
          opts.push({ value: list.id, label: folderPath.concat(list.name).join(' / ') });
        }
        addFolderListOptions(folder.folders, folderPath, opts);
      }
    }

    function openTask(id) {
      const task = id ? tasks.find(t => t.id === id) : null;
      const isManager = currentUser.role === 'manager';
      const editable = isManager || (task && task.assignee === currentUser.email);
      document.getElementById('modalTitle').textContent = task ? 'Edit Task' : 'New Task';
      document.getElementById('deleteTaskBtn').classList.toggle('hidden', !isManager || !task);
      document.getElementById('printNotesBtn').classList.toggle('hidden', !task);

      const studentOptions = Object.entries(userMap).filter(([email,u]) => u.role === 'student').map(([email,u]) => ({value: email, label: u.name}));
      fillSelect('tList', buildListOptions(), task ? task.listId : activeListId);
      fillSelect('tStatus', statuses, (task && statuses.includes(task.status)) ? task.status : 'Planned');
      fillSelect('tAssignee', studentOptions, task ? task.assignee : (studentOptions[0] && studentOptions[0].value));
      fillSelect('tPriority', priorities, (task && priorities.includes(task.priority)) ? task.priority : 'Medium');

      document.getElementById('tTitle').value = task ? task.title : '';
      document.getElementById('tStartDate').value = task ? (task.startDate || '') : '';
      document.getElementById('tStartTime').value = task ? (task.startTime || '') : '';
      document.getElementById('tDueDate').value = task ? (task.dueDate || '') : '';
      document.getElementById('tDueTime').value = task ? (task.dueTime || '') : '';
      document.getElementById('tDesc').value = task ? task.desc : '';
      document.getElementById('tNotes').value = task ? task.notes : '';

      ['tTitle','tList','tAssignee','tPriority','tStartDate','tStartTime','tDueDate','tDueTime','tDesc'].forEach(id => {
        document.getElementById(id).disabled = !isManager;
      });
      document.getElementById('tStatus').disabled = !editable;
      document.getElementById('tNotes').disabled = !editable;
      document.getElementById('saveTaskBtn').style.display = editable ? 'inline-block' : 'none';

      document.getElementById('printNotesBtn').onclick = () => { if (task) printTaskNotes(task); };
      document.getElementById('modal').dataset.id = id || '';
      document.getElementById('modal').classList.add('active');
    }

    function fillSelect(id, items, selected) {
      const sel = document.getElementById(id);
      sel.innerHTML = '';
      items.forEach(item => {
        const opt = document.createElement('option');
        if (typeof item === 'string') { opt.value = item; opt.textContent = item; }
        else { opt.value = item.value; opt.textContent = item.label; }
        if (opt.value === selected) opt.selected = true;
        sel.appendChild(opt);
      });
    }

    function closeModal() { document.getElementById('modal').classList.remove('active'); }

    function saveTask() {
      const id = document.getElementById('modal').dataset.id;
      const task = id ? tasks.find(t => t.id === id) : null;
      const editable = currentUser.role === 'manager' || (task && task.assignee === currentUser.email);
      if (!editable) { closeModal(); return; }
      const values = {
        title: document.getElementById('tTitle').value.trim(),
        listId: document.getElementById('tList').value,
        status: document.getElementById('tStatus').value,
        assignee: document.getElementById('tAssignee').value,
        priority: document.getElementById('tPriority').value,
        startDate: document.getElementById('tStartDate').value,
        startTime: document.getElementById('tStartTime').value,
        dueDate: document.getElementById('tDueDate').value,
        dueTime: document.getElementById('tDueTime').value,
        desc: document.getElementById('tDesc').value.trim(),
        notes: document.getElementById('tNotes').value.trim()
      };
      if (!values.title) { alert('Title is required'); return; }

      let updated;
      if (id) {
        const idx = tasks.findIndex(t => t.id === id);
        if (idx !== -1) {
          if (currentUser.role === 'manager') {
            updated = { ...values, id: id };
            tasks[idx] = updated;
          } else {
            tasks[idx].status = values.status;
            tasks[idx].notes = values.notes;
            updated = tasks[idx];
          }
        }
      } else if (currentUser.role === 'manager') {
        updated = { ...values, id: generateId() };
        tasks.push(updated);
      } else {
        closeModal(); return;
      }
      saveTasks();
      if (updated) {
        Promise.resolve(supabaseClient.from('hs_tasks').upsert({ id: updated.id, data: updated })).catch(err => console.error('Supabase task sync failed', err));
      }
      renderSidebar();
      render();
      closeModal();
    }

    function deleteTask() {
      const id = document.getElementById('modal').dataset.id;
      const task = tasks.find(t => t.id === id);
      if (!id || !task) return;
      if (currentUser.role !== 'manager' && task.assignee !== currentUser.email) return;
      if (confirm('Delete this task?')) {
        tasks = tasks.filter(t => t.id !== id);
        saveTasks();
        Promise.resolve(supabaseClient.from('hs_tasks').delete().eq('id', id)).catch(err => console.error('Supabase task delete failed', err));
        renderSidebar();
        render();
        closeModal();
      }
    }

    function printTaskNotes(task) {
      const found = findList(task.listId);
      const printArea = document.getElementById('printArea');
      printArea.innerHTML =
        '<h1>' + escapeHtml(task.title) + '</h1>' +
        '<div class="meta">' +
        (found ? escapeHtml(found.space.name + ' / ' + found.folder.name + ' / ' + found.list.name) + ' &bull; ' : '') +
        'Status: ' + escapeHtml(task.status) + ' &bull; ' +
        'Priority: ' + escapeHtml(task.priority) + ' &bull; ' +
        'Assignee: ' + (userMap[task.assignee]?.name || task.assignee) + '<br>' +
        'Start: ' + formatDateTime(task.startDate, task.startTime) + '<br>' +
        'Due: ' + formatDateTime(task.dueDate, task.dueTime) +
        '</div>' +
        '<div class="section"><h4>Description</h4><p>' + (task.desc ? escapeHtml(task.desc) : '—') + '</p></div>' +
        '<div class="section"><h4>Notes</h4><p>' + (task.notes ? escapeHtml(task.notes) : '—') + '</p></div>';
      printArea.style.display = 'block';
      window.print();
      printArea.style.display = 'none';
    }

    function findFolder(folderId) {
      for (const space of spaces) {
        const res = findFolderIn(space.folders, [], space, space.folders);
        if (res) return res;
      }
      return null;
    }

    function findFolderIn(folders, ancestors, space, parent) {
      for (let i = 0; i < folders.length; i++) {
        const f = folders[i];
        if (f.id === folderId) return { space, parent, folder: f, ancestors: [...ancestors] };
        const res = findFolderIn(f.folders, [...ancestors, f], space, f.folders);
        if (res) return res;
      }
      return null;
    }

    function promptAddFolderToSpace(spaceId) {
      const space = spaces.find(s => s.id === spaceId);
      if (!space) { alert('Space not found.'); return; }
      const name = prompt('Add folder to "' + space.name + '":');
      if (!name || !name.trim()) return;
      const id = generateId();
      space.folders.push({ id, name: name.trim(), folders: [], lists: [] });
      saveSpaces();
      syncSpacesToSupabase();
      expandedFolders.add(id);
      renderSidebar();
    }

    function promptAddFolder() {
      const options = spaces.map((s, i) => (i + 1) + '. ' + s.name).join('\n');
      const choice = prompt('Add folder to which space?\n' + options);
      if (!choice) return;
      const idx = parseInt(choice, 10) - 1;
      const space = spaces[idx];
      if (!space) { alert('Space not found.'); return; }
      promptAddFolderToSpace(space.id);
    }

    function promptAddSubfolder(parentFolderId) {
      const name = prompt('Subfolder name:');
      if (!name) return;
      const found = findFolder(parentFolderId);
      if (!found) { alert('Folder not found.'); return; }
      const id = generateId();
      found.folder.folders.push({ id, name: name.trim(), folders: [], lists: [] });
      expandedFolders.add(id);
      saveSpaces();
      syncSpacesToSupabase();
      renderSidebar();
    }

    function promptAddList() {
      const spaceId = prompt('Enter space ID (home-school or sporting):');
      const space = spaces.find(s => s.id === spaceId);
      if (!space) { alert('Space not found.'); return; }
      const folderId = prompt('Enter folder ID. Any nested folder in the space is valid.');
      const found = findFolder(folderId);
      if (!found || found.space.id !== spaceId) { alert('Folder not found.'); return; }
      const name = prompt('List name:');
      if (!name) return;
      found.folder.lists.push({ id: generateId(), name: name.trim() });
      saveSpaces();
      syncSpacesToSupabase();
      renderSidebar();
    }

    function promptAddListToFolder(folderId) {
      const found = findFolder(folderId);
      if (!found) { alert('Folder not found.'); return; }
      const name = prompt('List name:');
      if (!name) return;
      found.folder.lists.push({ id: generateId(), name: name.trim() });
      saveSpaces();
      syncSpacesToSupabase();
      renderSidebar();
    }

    function renameFolder(folderId) {
      const found = findFolder(folderId);
      if (!found) return;
      const name = prompt('Rename folder:', found.folder.name);
      if (name) { found.folder.name = name.trim(); saveSpaces(); syncSpacesToSupabase(); renderSidebar(); }
    }

    function renameList(listId) {
      const found = findList(listId);
      if (!found) return;
      const name = prompt('Rename list:', found.list.name);
      if (name) { found.list.name = name.trim(); saveSpaces(); syncSpacesToSupabase(); renderSidebar(); }
    }

    function deleteFolder(folderId) {
      const found = findFolder(folderId);
      if (!found) return;
      if (!confirm('Delete folder "' + found.folder.name + '" and all its lists?')) return;
      const listIds = collectListIds(found.folder);
      const deletedTaskIds = tasks.filter(t => listIds.has(t.listId)).map(t => t.id);
      const idx = found.parent.findIndex(f => f.id === folderId);
      if (idx !== -1) found.parent.splice(idx, 1);
      tasks = tasks.filter(t => !listIds.has(t.listId));
      saveSpaces();
      syncSpacesToSupabase();
      saveTasks();
      if (deletedTaskIds.length) {
        Promise.resolve(supabaseClient.from('hs_tasks').delete().in('id', deletedTaskIds)).catch(err => console.error('Supabase task delete failed', err));
      }
      expandedFolders.delete(folderId);
      if (activeListId && listIds.has(activeListId)) {
        activeListId = null;
        document.getElementById('pageTitle').textContent = 'Select a list';
        document.getElementById('pageBreadcrumb').textContent = '';
      }
      renderSidebar();
      render();
    }

    function deleteList(listId) {
      const found = findList(listId);
      if (!found) return;
      if (!confirm('Delete list "' + found.list.name + '"?')) return;
      const idx = found.folder.lists.findIndex(l => l.id === listId);
      if (idx !== -1) found.folder.lists.splice(idx, 1);
      const deletedTaskIds = tasks.filter(t => t.listId === listId).map(t => t.id);
      tasks = tasks.filter(t => t.listId !== listId);
      saveSpaces();
      syncSpacesToSupabase();
      saveTasks();
      if (deletedTaskIds.length) {
        Promise.resolve(supabaseClient.from('hs_tasks').delete().in('id', deletedTaskIds)).catch(err => console.error('Supabase task delete failed', err));
      }
      if (activeListId === listId) {
        activeListId = null;
        document.getElementById('pageTitle').textContent = 'Select a list';
        document.getElementById('pageBreadcrumb').textContent = '';
      }
      renderSidebar();
      render();
    }

    function collectListIds(folder) {
      const set = new Set();
      (folder.lists || []).forEach(l => set.add(l.id));
      (folder.folders || []).forEach(sub => {
        collectListIds(sub).forEach(id => set.add(id));
      });
      return set;
    }

    function switchView(view) {
      currentView = view;
      document.getElementById('viewBoard').classList.toggle('active', view === 'board');
      document.getElementById('viewCalendar').classList.toggle('active', view === 'calendar');
      ['calDay','calWeek','calMonth'].forEach(id => {
        const el = document.getElementById(id);
        el.disabled = view !== 'calendar';
        el.classList.remove('active');
      });
      if (view === 'calendar') {
        document.getElementById('calendarNav').style.display = 'flex';
        document.getElementById('board').style.display = 'none';
        document.getElementById('calendarView').classList.add('active');
        setCalendarMode(calendarMode);
      } else {
        document.getElementById('calendarNav').style.display = 'none';
        document.getElementById('board').style.display = 'block';
        document.getElementById('calendarView').classList.remove('active');
        renderSidebar();
        renderBoard();
      }
    }

    function setCalendarMode(mode) {
      calendarMode = mode;
      ['calDay','calWeek','calMonth'].forEach(id => {
        document.getElementById(id).classList.toggle('active', (id === 'cal' + (mode.charAt(0).toUpperCase() + mode.slice(1))));
      });
      renderCalendar();
    }

    function render() {
      if (currentView === 'board') renderBoard();
      else renderCalendar();
    }

    function getVisibleCalendarTasks() {
      return tasks.filter(t => currentUser.role === 'manager' || t.assignee === currentUser.email);
    }

    function getDisplayDate(task) {
      return task.dueDate || task.startDate;
    }

    function getDisplayTime(task, dateStr) {
      if (task.dueDate === dateStr) return task.dueTime || task.startTime || '';
      return task.startTime || task.dueTime || '';
    }

    function getDayTasks(dateStr, visibleTasks) {
      const list = [];
      visibleTasks.forEach(t => {
        const d = getDisplayDate(t);
        if (d === dateStr) {
          list.push({ task: t, time: getDisplayTime(t, dateStr) });
        }
      });
      list.sort((a, b) => {
        if (a.time && b.time) return a.time.localeCompare(b.time);
        if (a.time) return -1;
        if (b.time) return 1;
        return a.task.title.localeCompare(b.task.title);
      });
      return list.map(x => x.task);
    }

    function createCalendarTask(task, dateStr) {
      const time = getDisplayTime(task, dateStr);
      const el = document.createElement('div');
      el.className = 'calendar-task';
      el.innerHTML = '<div>' + escapeHtml(task.title) + '</div>' +
        (time ? '<div class="time">' + time + '</div>' : '') +
        '<div><span class="badge priority-' + task.priority.toLowerCase() + '">' + task.priority + '</span></div>';
      el.addEventListener('click', () => openTask(task.id));
      return el;
    }

    function formatShortDate(d) {
      return d.getDate() + ' ' + MONTH_NAMES[d.getMonth()] + ' ' + d.getFullYear();
    }

    function renderCalendar() {
      const grid = document.getElementById('calendarGrid');
      grid.innerHTML = '';
      document.getElementById('pageTitle').textContent = 'Calendar';
      document.getElementById('pageBreadcrumb').textContent = 'Schedule';

      const visibleTasks = getVisibleCalendarTasks();

      if (calendarMode === 'month') {
        const startOfMonth = new Date(calendarDate.getFullYear(), calendarDate.getMonth(), 1);
        const gridStart = startOfWeek(startOfMonth);
        grid.className = 'calendar-grid';
        for (let i = 0; i < 42; i++) {
          const d = addDays(gridStart, i);
          const dateStr = toISODate(d);
          const isCurrentMonth = d.getMonth() === calendarDate.getMonth();
          const cell = document.createElement('div');
          cell.className = 'calendar-day' + (isCurrentMonth ? '' : ' calendar-other-month');
          cell.innerHTML = '<div class="day-label">' + DAY_NAMES[d.getDay()] + ' ' + d.getDate() + '</div>';
          const taskList = document.createElement('div');
          taskList.className = 'day-tasks';
          const dayTasks = getDayTasks(dateStr, visibleTasks);
          if (dayTasks.length === 0) {
            taskList.innerHTML = '<span style="color:#9ca3af;font-size:11px">No tasks</span>';
          } else {
            dayTasks.forEach(task => taskList.appendChild(createCalendarTask(task, dateStr)));
          }
          cell.appendChild(taskList);
          grid.appendChild(cell);
        }
        document.getElementById('calDateLabel').textContent = MONTH_NAMES[calendarDate.getMonth()] + ' ' + calendarDate.getFullYear();
      } else if (calendarMode === 'week') {
        const start = startOfWeek(calendarDate);
        grid.className = 'calendar-week';
        for (let i = 0; i < 7; i++) {
          const d = addDays(start, i);
          const dateStr = toISODate(d);
          const cell = document.createElement('div');
          cell.className = 'calendar-day';
          cell.innerHTML = '<div class="day-label">' + DAY_NAMES[d.getDay()] + ' ' + d.getDate() + '</div>';
          const taskList = document.createElement('div');
          taskList.className = 'day-tasks';
          const dayTasks = getDayTasks(dateStr, visibleTasks);
          if (dayTasks.length === 0) {
            taskList.innerHTML = '<span style="color:#9ca3af;font-size:11px">No tasks</span>';
          } else {
            dayTasks.forEach(task => taskList.appendChild(createCalendarTask(task, dateStr)));
          }
          cell.appendChild(taskList);
          grid.appendChild(cell);
        }
        const end = addDays(start, 6);
        document.getElementById('calDateLabel').textContent = formatShortDate(start) + ' – ' + formatShortDate(end);
      } else if (calendarMode === 'day') {
        const dateStr = toISODate(calendarDate);
        grid.className = 'calendar-day-view';
        const header = document.createElement('div');
        header.className = 'day-header';
        header.textContent = DAY_NAMES[calendarDate.getDay()] + ', ' + formatShortDate(calendarDate);
        grid.appendChild(header);
        const dayTasks = getDayTasks(dateStr, visibleTasks);
        if (dayTasks.length === 0) {
          const empty = document.createElement('p');
          empty.className = 'empty';
          empty.textContent = 'No tasks for this day.';
          grid.appendChild(empty);
        } else {
          dayTasks.forEach(task => {
            const time = getDisplayTime(task, dateStr);
            const el = document.createElement('div');
            el.className = 'day-task';
            el.innerHTML = '<strong>' + escapeHtml(task.title) + '</strong>' +
              (time ? '<br><span style="color:var(--muted);font-size:12px">' + time + '</span>' : '') +
              '<br><span class="badge priority-' + task.priority.toLowerCase() + '">' + task.priority + '</span>';
            el.addEventListener('click', () => openTask(task.id));
            grid.appendChild(el);
          });
        }
        document.getElementById('calDateLabel').textContent = formatShortDate(calendarDate);
      }
    }

    function navigateCalendar(dir) {
      if (calendarMode === 'day') calendarDate = addDays(calendarDate, dir);
      else if (calendarMode === 'week') calendarDate = addDays(calendarDate, dir * 7);
      else if (calendarMode === 'month') calendarDate = addMonths(calendarDate, dir);
      renderCalendar();
    }

    document.getElementById('loginForm').addEventListener('submit', async e => {
      e.preventDefault();
      const email = document.getElementById('username').value.trim().toLowerCase();
      const password = document.getElementById('password').value;
      const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
      if (error || !data.user || !userMap[email]) {
        document.getElementById('loginError').style.display = 'block';
        return;
      }
      currentUser = { ...data.user, name: userMap[email].name, role: userMap[email].role, email };
      document.getElementById('loginError').style.display = 'none';
      loadSpaces();
      loadTasks();
      setViews();
      if (!activeListId) {
        activeListId = 'pe-t3';
        expandedFolders.add('pe');
      }
      renderSidebar();
      selectList(activeListId);
    });

    document.getElementById('logoutBtn').addEventListener('click', async () => {
      await supabaseClient.auth.signOut();
      currentUser = null;
      activeListId = null;
      expandedFolders.clear();
      currentView = 'board';
      calendarMode = 'month';
      setViews();
    });

    document.getElementById('addTaskBtn').addEventListener('click', () => openTask(null));
    document.getElementById('closeModal').addEventListener('click', closeModal);
    document.getElementById('cancelModal').addEventListener('click', closeModal);
    document.getElementById('saveTaskBtn').addEventListener('click', saveTask);
    document.getElementById('deleteTaskBtn').addEventListener('click', deleteTask);
    document.getElementById('addFolderBtn').addEventListener('click', promptAddFolder);
    document.getElementById('addListBtn').addEventListener('click', promptAddList);

    document.getElementById('viewBoard').addEventListener('click', () => switchView('board'));
    document.getElementById('viewCalendar').addEventListener('click', () => switchView('calendar'));
    document.getElementById('calDay').addEventListener('click', () => setCalendarMode('day'));
    document.getElementById('calWeek').addEventListener('click', () => setCalendarMode('week'));
    document.getElementById('calMonth').addEventListener('click', () => setCalendarMode('month'));
    document.getElementById('calPrev').addEventListener('click', () => navigateCalendar(-1));
    document.getElementById('calNext').addEventListener('click', () => navigateCalendar(1));
    document.getElementById('calToday').addEventListener('click', () => { calendarDate = new Date(); renderCalendar(); });

    window.addEventListener('click', e => {
      closeAllDropdowns();
      if (e.target.id === 'modal') closeModal();
      if (e.target.id === 'datePickerModal') closeDatePicker();
      if (e.target.id === 'timePickerModal') closeTimePicker();
    });

    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') {
        closeAllDropdowns();
        if (document.getElementById('datePickerModal').classList.contains('active')) { closeDatePicker(); return; }
        if (document.getElementById('timePickerModal').classList.contains('active')) { closeTimePicker(); return; }
        if (document.getElementById('modal').classList.contains('active')) closeModal();
      }
    });

    // Date & Time Picker state and functions
    let datePickerInput = null;
    let datePickerSelected = null;
    let datePickerView = new Date();

    function openDatePicker(input) {
      datePickerInput = input;
      const val = input.value;
      if (val && /^\d{4}-\d{2}-\d{2}$/.test(val)) {
        const [y, m, d] = val.split('-').map(Number);
        datePickerSelected = new Date(y, m - 1, d);
        datePickerView = new Date(y, m - 1, d);
      } else {
        datePickerSelected = null;
        datePickerView = new Date();
      }
      document.getElementById('datePickerModal').classList.add('active');
      renderDatePicker();
    }

    function renderDatePicker() {
      const year = datePickerView.getFullYear();
      const month = datePickerView.getMonth();
      document.getElementById('dpMonthYear').textContent = MONTH_NAMES[month] + ' ' + year;
      const start = startOfWeek(new Date(year, month, 1));
      const daysEl = document.getElementById('dpDays');
      daysEl.innerHTML = '';
      const today = toISODate(new Date());
      const selectedStr = datePickerSelected ? toISODate(datePickerSelected) : null;
      for (let i = 0; i < 42; i++) {
        const d = addDays(start, i);
        const dateStr = toISODate(d);
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'day-cell' +
          (d.getMonth() !== month ? ' other' : '') +
          (dateStr === today ? ' today' : '') +
          (dateStr === selectedStr ? ' selected' : '');
        btn.textContent = d.getDate();
        btn.addEventListener('click', () => {
          datePickerSelected = d;
          renderDatePicker();
        });
        daysEl.appendChild(btn);
      }
    }

    function closeDatePicker() {
      document.getElementById('datePickerModal').classList.remove('active');
      datePickerInput = null;
    }

    let timePickerInput = null;
    let timePickerHour = 12;
    let timePickerMinute = 0;
    let timePickerAmPm = 'AM';
    let timePickerMode = 'hour';

    function openTimePicker(input) {
      timePickerInput = input;
      timePickerMode = 'hour';
      const val = input.value;
      if (val && /^\d{1,2}:\d{2}$/.test(val)) {
        const [h, m] = val.split(':').map(Number);
        const h24 = h % 24;
        timePickerMinute = m;
        timePickerAmPm = h24 < 12 ? 'AM' : 'PM';
        let h12 = h24 % 12;
        if (h12 === 0) h12 = 12;
        timePickerHour = h12;
      } else {
        const now = new Date();
        const h24 = now.getHours();
        timePickerMinute = now.getMinutes();
        timePickerAmPm = h24 < 12 ? 'AM' : 'PM';
        let h12 = h24 % 12;
        if (h12 === 0) h12 = 12;
        timePickerHour = h12;
      }
      document.getElementById('timePickerModal').classList.add('active');
      renderTimePicker();
    }

    function renderTimePicker() {
      document.getElementById('tpSub').textContent = timePickerMode === 'hour' ? 'SELECT HOUR' : 'SELECT MINUTE';
      document.getElementById('tpDisplay').textContent =
        String(timePickerHour).padStart(2, '0') + ':' + String(timePickerMinute).padStart(2, '0') + ' ' + timePickerAmPm;
      document.getElementById('tpAM').classList.toggle('active', timePickerAmPm === 'AM');
      document.getElementById('tpPM').classList.toggle('active', timePickerAmPm === 'PM');
      const dial = document.getElementById('tpDial');
      dial.innerHTML = '';
      // Both hour and minute dials show 12 evenly-spaced marks. Minutes snap to
      // 5-minute increments, which is precise enough for scheduling and keeps
      // the dial readable (60 crammed numbers is impractical to tap).
      const radius = 40;
      const step = timePickerMode === 'hour' ? 1 : 5;
      const nearestStep = Math.round(timePickerMinute / 5) * 5 % 60;
      for (let i = 0; i < 12; i++) {
        const n = timePickerMode === 'hour' ? (i === 0 ? 12 : i) : i * step;
        const angle = (i / 12 * 360) - 90;
        const rad = angle * Math.PI / 180;
        const x = 50 + Math.cos(rad) * radius;
        const y = 50 + Math.sin(rad) * radius;
        const btn = document.createElement('button');
        btn.type = 'button';
        const isSelected = timePickerMode === 'hour' ? n === timePickerHour : n === nearestStep;
        btn.className = 'dial-number' + (isSelected ? ' selected' : '');
        btn.textContent = timePickerMode === 'hour' ? n : String(n).padStart(2, '0');
        btn.style.left = x + '%';
        btn.style.top = y + '%';
        btn.addEventListener('click', () => {
          if (timePickerMode === 'hour') {
            timePickerHour = n;
            timePickerMode = 'minute';
            renderTimePicker();
          } else {
            timePickerMinute = n;
            renderTimePicker();
          }
        });
        dial.appendChild(btn);
      }
    }

    function closeTimePicker() {
      document.getElementById('timePickerModal').classList.remove('active');
      timePickerInput = null;
    }

    document.getElementById('dpPrev').addEventListener('click', () => { datePickerView = addMonths(datePickerView, -1); renderDatePicker(); });
    document.getElementById('dpNext').addEventListener('click', () => { datePickerView = addMonths(datePickerView, 1); renderDatePicker(); });
    document.getElementById('dpClear').addEventListener('click', () => { if (datePickerInput) datePickerInput.value = ''; closeDatePicker(); });
    document.getElementById('dpCancel').addEventListener('click', closeDatePicker);
    document.getElementById('dpDone').addEventListener('click', () => {
      if (datePickerInput && datePickerSelected) datePickerInput.value = toISODate(datePickerSelected);
      closeDatePicker();
    });
    document.getElementById('dpToday').addEventListener('click', () => {
      const now = new Date();
      datePickerSelected = now;
      datePickerView = new Date(now.getFullYear(), now.getMonth(), 1);
      renderDatePicker();
      if (datePickerInput) datePickerInput.value = toISODate(now);
      closeDatePicker();
    });
    document.getElementById('tpAM').addEventListener('click', () => { timePickerAmPm = 'AM'; renderTimePicker(); });
    document.getElementById('tpPM').addEventListener('click', () => { timePickerAmPm = 'PM'; renderTimePicker(); });
    document.getElementById('tpCancel').addEventListener('click', closeTimePicker);
    document.getElementById('tpDone').addEventListener('click', () => {
      if (timePickerInput) {
        let hour24 = timePickerHour;
        if (timePickerHour === 12) hour24 = timePickerAmPm === 'AM' ? 0 : 12;
        else hour24 = timePickerAmPm === 'AM' ? timePickerHour : timePickerHour + 12;
        timePickerInput.value = String(hour24).padStart(2, '0') + ':' + String(timePickerMinute).padStart(2, '0');
      }
      closeTimePicker();
    });
    document.getElementById('tStartDate').addEventListener('click', () => openDatePicker(document.getElementById('tStartDate')));
    document.getElementById('tDueDate').addEventListener('click', () => openDatePicker(document.getElementById('tDueDate')));
    document.getElementById('tStartTime').addEventListener('click', () => openTimePicker(document.getElementById('tStartTime')));
    document.getElementById('tDueTime').addEventListener('click', () => openTimePicker(document.getElementById('tDueTime')));

    async function init() {
      const { data: { session } } = await supabaseClient.auth.getSession();
      const email = session && session.user ? (session.user.email || '').toLowerCase() : '';
      if (email && userMap[email]) {
        currentUser = { ...session.user, name: userMap[email].name, role: userMap[email].role, email };
        // Force a fresh access token so any recent role/permission changes take effect immediately.
        supabaseClient.auth.refreshSession().catch(err => console.error('Session refresh failed', err));
        setViews();
        loadSpaces();
        loadTasks();
        if (!activeListId) {
          activeListId = 'pe-t3';
          expandedFolders.add('pe');
        }
        renderSidebar();
        selectList(activeListId);
      } else {
        setViews();
      }
    }

    init();
  </script>
</body>
